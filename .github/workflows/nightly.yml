name: nightly-quality-gates

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: nightly-quality-gates
  cancel-in-progress: true

jobs:
  backend-regression:
    name: Backend integration and protocol regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run all backend tests
        run: ./gradlew build integrationTest --info

  software-composition:
    name: Daily SCA, licenses, secrets and IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan dependencies, licenses, secrets and IaC
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,license,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-nightly.sarif
          trivyignores: config/trivy/.trivyignore

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-nightly.sarif
          category: trivy-nightly

  deployed-dev:
    name: DEV authenticated DAST and performance
    runs-on: ubuntu-latest
    environment: development
    env:
      BASE_URL: ${{ vars.DEV_BASE_URL }}
      BEARER_TOKEN: ${{ secrets.DEV_TEST_BEARER_TOKEN }}
      KEY_ID: ${{ secrets.DEV_TEST_KEY_ID }}
    steps:
      - name: Checkout deployed-environment suites
        uses: actions/checkout@v4

      - name: Require DEV test configuration
        run: |
          if [[ -z "${BASE_URL}" || -z "${BEARER_TOKEN}" || -z "${KEY_ID}" ]]; then
            echo "::error::Configure DEV_BASE_URL, DEV_TEST_BEARER_TOKEN and DEV_TEST_KEY_ID in the development environment."
            exit 1
          fi

      - name: Run authenticated ZAP full scan
        uses: zaproxy/action-full-scan@v0.12.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ secrets.DEV_TEST_BEARER_TOKEN }}
        with:
          target: ${{ vars.DEV_BASE_URL }}/business-wallet
          artifact_name: zap-full-dev
          fail_action: true
          allow_issue_writing: false

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run sustained signing performance gate
        run: k6 run src/test/resources/perf/sign-warm-stg.js

      - name: Run burst signing performance gate
        run: k6 run src/test/resources/perf/sign-burst-stg.js
