name: reusable-cd-dev

on:
  workflow_call:
    inputs:
      project_name:
        description: Project prefix used in AWS resource names
        required: true
        type: string
      app_name:
        description: Application identifier used in AWS resource names
        required: true
        type: string
      region_code:
        description: Region abbreviation used in AWS resource names
        required: true
        type: string
      environment:
        description: GitHub Environment and deployment environment name
        required: false
        type: string
        default: dev
      smoke_url:
        description: Complete health endpoint URL for the deployed application
        required: true
        type: string
      java_version:
        description: Java version used to build the application
        required: false
        type: string
        default: '25'
    secrets:
      SONAR_TOKEN:
        description: SonarCloud authentication token
        required: true
      AWS_ACCESS_KEY_ID_DEV:
        description: AWS access key for the development account
        required: true
      AWS_SECRET_ACCESS_KEY_DEV:
        description: AWS secret access key for the development account
        required: true
      AWS_REGION:
        description: AWS region containing the deployment resources
        required: true

env:
  PROJECT_NAME: ${{ inputs.project_name }}
  APP_NAME: ${{ inputs.app_name }}
  REGION_CODE: ${{ inputs.region_code }}

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ format('{0}-{1}', github.repository, inputs.environment) }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, scan and publish DEV artifact
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.metadata.outputs.image }}
      version_tag: ${{ steps.metadata.outputs.version_tag }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate deployment configuration
        run: |
          for variable in PROJECT_NAME APP_NAME REGION_CODE; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Configure the ${variable} repository variable."
              exit 1
            fi
          done

      - name: Build application
        run: ./gradlew build -x test --info

      - name: Run tests
        id: tests
        continue-on-error: true
        run: ./gradlew test integrationTest --continue --info

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn

      - name: Report non-blocking test failure
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        run: |
          echo "::warning::Tests failed, but test failures are configured as non-blocking."
          {
            echo '## Test result'
            echo
            echo ':warning: Tests failed. Review the `test-reports` artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run SonarCloud
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info

      - name: SonarCloud quality gate
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: build/sonar/report-task.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Resolve image metadata
        id: metadata
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE="${ECR_REGISTRY}/${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          VERSION_TAG="${ENVIRONMENT}-${SHORT_SHA}"
          {
            echo "image=${IMAGE}"
            echo "version_tag=${VERSION_TAG}"
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION_TAG}"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push immutable DEV image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: SKIP_TESTS=true
          tags: ${{ steps.metadata.outputs.tags }}
          provenance: false

      - name: Scan DEV container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          trivyignores: config/trivy/.trivyignore

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ inputs.environment }}-${{ github.sha }}
          path: sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image and attach SBOM
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy DEV
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      SMOKE_URL: ${{ inputs.smoke_url }}
    steps:
      - name: Checkout deployment checks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require DEV smoke endpoint
        run: |
          if [[ -z "${SMOKE_URL}" ]]; then
            echo "::error::Configure SMOKE_URL in the ${ENVIRONMENT} GitHub Environment."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish validated DEV deployment tags
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          MANIFEST="$(aws ecr batch-get-image \
            --repository-name "${REPOSITORY}" \
            --image-ids imageDigest="${DIGEST}" \
            --query 'images[0].imageManifest' \
            --output text \
            --region "${{ secrets.AWS_REGION }}")"
          for tag in "${ENVIRONMENT}" latest; do
            aws ecr put-image \
              --repository-name "${REPOSITORY}" \
              --image-tag "${tag}" \
              --image-manifest "${MANIFEST}" \
              --region "${{ secrets.AWS_REGION }}" \
              --no-cli-pager > /dev/null
          done

      - name: Force new ECS deployment
        run: |
          set -euo pipefail
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager

      - name: Run DEV smoke test
        run: bash .github/scripts/smoke.sh "${SMOKE_URL}"

      - name: Publish deployment summary
        run: |
          {
            echo "### DEV deployment"
            echo "- Tag: ${{ needs.build.outputs.version_tag }}"
            echo "- Digest: ${{ needs.build.outputs.digest }}"
          } >> "${GITHUB_STEP_SUMMARY}"
