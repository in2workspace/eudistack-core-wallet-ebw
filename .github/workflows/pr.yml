name: pr-to-main

on:
  pull_request:
    branches:
      - main
      - 'release/v*'
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  application-ci:
    uses: in2workspace/eudistack-devops-workflows/.github/workflows/ecs-api-pr.yml@1335d59e67ca288d91b407996a2e4bf5bb4b092b
    with:
      container_image: 'wallet-ebw-service'
      container_name: 'wallet-ebw-service'
      smoke_url: 'http://localhost:8080/business-wallet/health/readiness'
      zap_target_url: 'http://localhost:8080/business-wallet/.well-known/wallet-config-metadata'
      dast_start_script: 'dev-tools/testing/start-dast-container.sh'
    secrets:
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  license-compliance:
    uses: in2workspace/eudistack-devops-workflows/.github/workflows/common-license-gate.yml@1335d59e67ca288d91b407996a2e4bf5bb4b092b
    secrets:
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

  analyze:
    uses: in2workspace/eudistack-devops-workflows/.github/workflows/common-codeql-java.yml@1335d59e67ca288d91b407996a2e4bf5bb4b092b
    secrets:
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
