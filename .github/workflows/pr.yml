name: pr-to-main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  JACOCO_MIN_COVERAGE_OVERALL: 40
  JACOCO_MIN_COVERAGE_CHANGED_FILES: 60

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!.github/**'
              - '!LICENSE'
              - '!.gitignore'

  build:
    name: Build & Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build & Test
        run: ./gradlew build --info

      - name: Publish JaCoCo Coverage
        if: always()
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: ${{ env.JACOCO_MIN_COVERAGE_OVERALL }}
          min-coverage-changed-files: ${{ env.JACOCO_MIN_COVERAGE_CHANGED_FILES }}
          update-comment: true

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/jacocoHtml/

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info

      - name: SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: build/sonar/report-task.txt

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-db-${{ steps.date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-trivy-db-

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'build/libs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'
          cache-dir: '~/.cache/trivy'
          trivyignores: 'config/trivy/.trivyignore'

      - name: Trivy Report (JSON)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'build/libs'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: true
          format: 'json'
          output: 'build/reports/trivy-report.json'
          cache-dir: '~/.cache/trivy'
          trivyignores: 'config/trivy/.trivyignore'

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: build/reports/trivy-report.json

  dast-baseline:
    name: ZAP DAST Baseline
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # G2 (conv-infrastructure-testing.md §6.3): passive scan, non-blocking.
    # WARN-level findings are surfaced only via the uploaded HTML report.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eudistack
          POSTGRES_USER: eudistack
          POSTGRES_PASSWORD: eudistack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eudistack -d eudistack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # SKIP_TESTS=true: the `build` job (above) already ran the full test suite
      # for the quality gate — re-running tests inside the Docker build here would
      # duplicate that work and risks failing this job on a test issue unrelated
      # to DAST (e.g. a test needing infra this container's build stage lacks).
      - name: Build Docker image
        run: docker build --build-arg SKIP_TESTS=true -t eudistack-core-wallet-ebw:pr .

      - name: Seed tenant_registry (sandbox)
        run: |
          PGPASSWORD=eudistack psql -h localhost -U eudistack -d eudistack -c "
            CREATE TABLE IF NOT EXISTS public.tenant_registry (
                schema_name   VARCHAR(64)  PRIMARY KEY,
                display_name  VARCHAR(255) NOT NULL,
                tenant_type   VARCHAR(20)  NOT NULL DEFAULT 'simple',
                status        VARCHAR(20)  NOT NULL DEFAULT 'active',
                created_at    TIMESTAMPTZ  NOT NULL DEFAULT now(),
                updated_at    TIMESTAMPTZ  NOT NULL DEFAULT now()
            );
            INSERT INTO public.tenant_registry (schema_name, display_name, tenant_type)
            VALUES ('sandbox', 'EUDIStack Sandbox', 'multi_org')
            ON CONFLICT (schema_name) DO NOTHING;
          "

      - name: Run container
        run: |
          docker run -d --name wallet-ebw-service \
            --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=eudistack \
            -e DB_USERNAME=eudistack \
            -e DB_PASSWORD=eudistack \
            -e TRUST_FORWARDED_HOST=true \
            eudistack-core-wallet-ebw:pr

      - name: Wait for service health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/business-wallet/health; then exit 0; fi
            sleep 2
          done
          echo "Service did not become healthy in time"
          docker logs wallet-ebw-service
          exit 1

      # Rules file: dev-tools/testing/zap/zap-baseline.conf (this repo), vendored
      # from eudistack-platform-dev's dev-tools/testing/baseline/zap/zap-baseline.conf
      # (single source of truth per convention §5.3) — copied here to avoid a
      # cross-repo read token. Update the source there, then re-copy here.
      #
      # TRUST_FORWARDED_HOST=true (above) + ZAP_AUTH_HEADER make X-Tenant: sandbox
      # actually resolve: TenantDomainWebFilter ignores X-Tenant entirely unless
      # ebw.security.trust-forwarded-host is enabled (default false).
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        env:
          ZAP_AUTH_HEADER: X-Tenant
          ZAP_AUTH_HEADER_VALUE: sandbox
        with:
          target: 'http://localhost:8080/business-wallet'
          rules_file_name: 'dev-tools/testing/zap/zap-baseline.conf'
          artifact_name: 'zap-report'
          fail_action: false
          allow_issue_writing: false