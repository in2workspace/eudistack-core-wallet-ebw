name: pr-to-main

on:
  pull_request:
    branches:
      - main
      - 'release/v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  application-ci:
    uses: ./.github/workflows/reusable-pr.yml
    with:
      container_image: 'wallet-ebw-service'
      container_name: 'wallet-ebw-service'
      smoke_url: ' http://localhost:8080/business-wallet/health'
      zap_target_url: 'http://localhost:8080/business-wallet'
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
