name: License Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-gate:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the license gate itself
        run: node --test .github/scripts/license-gate.test.mjs

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom

      - name: Evaluate licenses
        run: node .github/scripts/license-gate.mjs --sbom-path build/reports/sbom/sbom.json
