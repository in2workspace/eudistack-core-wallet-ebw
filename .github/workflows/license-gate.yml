name: License Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-gate:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom

      - name: Run License Gate
        uses: in2workspace/eudistack-platform-dev/.github/actions/license-gate@license-gate-v1.0.0
        with:
          sbom-path: build/reports/sbom/sbom.json
          policy-path: .github/license-policy.json
          exceptions-path: .github/license-exceptions.json
