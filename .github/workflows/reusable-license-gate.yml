name: reusable-license-gate

on:
  workflow_call:
    inputs:
      java_version:
        description: Java version used to generate the SBOM
        required: false
        type: string
        default: '25'
      node_version:
        description: Node.js version used by the license evaluator
        required: false
        type: string
        default: '22'
      sbom_command:
        description: Command used to generate the CycloneDX SBOM
        required: false
        type: string
        default: ./gradlew cyclonedxBom
      sbom_path:
        description: Generated CycloneDX SBOM path
        required: false
        type: string
        default: build/reports/sbom/sbom.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect license-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: 'every'
          filters: |
            relevant:
              - '!**/*.md'
              - '!.github/**'
              - '!docs/**'
              - '!LICENSE'
              - '!.gitignore'

  license-gate:
    name: License Compliance Check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java_version }}
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Verify the license gate itself
        run: node --test .github/scripts/license-gate.test.mjs

      - name: Generate CycloneDX SBOM
        run: ${{ inputs.sbom_command }}

      - name: Evaluate licenses
        run: node .github/scripts/license-gate.mjs --sbom-path "${{ inputs.sbom_path }}"
