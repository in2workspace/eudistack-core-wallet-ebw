name: release

on:
  push:
    branches:
      - 'release/v*'

env:
  PROJECT_NAME: eudistack
  APP_NAME: wallet-ebw
  REGION_CODE: ew1

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build, verify and publish RC
    if: "${{ !(github.event.created && startsWith(github.event.head_commit.message, 'chore(release): prepare v')) }}"
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.metadata.outputs.image }}
      rc_tag: ${{ steps.metadata.outputs.rc_tag }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      ENVIRONMENT: stg
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate release branch and correction count
        id: release-policy
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#release/}"
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch ${GITHUB_REF_NAME} must use release/vX.Y.Z format."
            exit 1
          fi

          git fetch --no-tags origin main
          MERGE_BASE="$(git merge-base origin/main HEAD)"
          PREPARE_COMMIT="$(git log --format='%H%x09%s' \
            | awk -F '\t' -v message="chore(release): prepare ${VERSION}" \
              '$2 == message {print $1; exit}')"
          if [[ -n "${PREPARE_COMMIT}" ]]; then
            CORRECTIONS="$(git rev-list --count "${PREPARE_COMMIT}..HEAD")"
          else
            CORRECTIONS="$(git rev-list --count "${MERGE_BASE}..HEAD")"
          fi
          if (( CORRECTIONS > 3 )); then
            echo "::error::Release has ${CORRECTIONS} corrections; abort and cut a new release."
            exit 1
          fi

          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release ${VERSION} already exists. Cut a new MINOR release."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve RC metadata
        id: metadata
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#release/}"
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE="${ECR_REGISTRY}/${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          RC_TAG="${VERSION}-rc-${SHORT_SHA}"
          {
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "rc_tag=${RC_TAG}"
            echo "tags<<EOF"
            echo "${IMAGE}:${RC_TAG}"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push RC image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SKIP_TESTS=true
          tags: ${{ steps.metadata.outputs.tags }}
          provenance: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.metadata.outputs.rc_tag }}
          path: sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image and attach SBOM
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-stg:
    name: Deploy and validate STG
    needs: [build]
    runs-on: ubuntu-latest
    environment: stg
    concurrency:
      group: ${{ vars.STAGING_CONCURRENCY_GROUP || format('{0}-staging', github.repository) }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: stg
    steps:
      - name: Checkout deployment checks
        uses: actions/checkout@v4

      - name: Reject superseded release candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          CURRENT_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${CURRENT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::A newer release candidate (${CURRENT_SHA}) supersedes ${GITHUB_SHA}."
            exit 1
          fi
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release ${VERSION} already exists."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Force new ECS deployment
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          MANIFEST="$(aws ecr batch-get-image \
            --repository-name "${REPOSITORY}" \
            --image-ids imageDigest="${DIGEST}" \
            --query 'images[0].imageManifest' \
            --output text \
            --region "${{ secrets.AWS_REGION }}")"
          for tag in "${ENVIRONMENT}" latest; do
            aws ecr put-image \
              --repository-name "${REPOSITORY}" \
              --image-tag "${tag}" \
              --image-manifest "${MANIFEST}" \
              --region "${{ secrets.AWS_REGION }}" \
              --no-cli-pager > /dev/null
          done
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager

  release-readiness:
    name: PM, customer and release-readiness acceptance
    needs: [build, deploy-stg]
    runs-on: ubuntu-latest
    environment: staging-validation
    steps:
      - name: Create release manifest
        run: |
          {
            echo "# Release readiness"
            echo
            echo "- Component: ${APP_NAME}"
            echo "- Version: ${{ needs.build.outputs.version }}"
            echo "- RC tag: ${{ needs.build.outputs.rc_tag }}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Image: ${{ needs.build.outputs.image }}"
            echo "- Digest: ${{ needs.build.outputs.digest }}"
            echo "- STG smoke: passed"
            echo "- Approval environment: staging-validation"
          } > release-readiness.md

      - name: Upload signed release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-${{ needs.build.outputs.version }}
          path: release-readiness.md

      - name: Attest release-readiness evidence
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-readiness.md

      - name: Publish readiness summary
        run: cat release-readiness.md >> "${GITHUB_STEP_SUMMARY}"

  deploy-pro:
    name: Promote digest, deploy and monitor PRD
    needs: [build, release-readiness]
    runs-on: ubuntu-latest
    environment: pro
    concurrency:
      group: ${{ vars.PRODUCTION_CONCURRENCY_GROUP || format('{0}-production', github.repository) }}
      cancel-in-progress: false
    env:
      FROM_ENV: stg
      ENVIRONMENT: pro
      MONITOR_MINUTES: ${{ vars.PRO_MONITOR_MINUTES }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout deployment checks
        uses: actions/checkout@v4

      - name: Reject superseded production candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          CURRENT_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${CURRENT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::A newer release candidate (${CURRENT_SHA}) supersedes ${GITHUB_SHA}."
            exit 1
          fi
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release ${VERSION} already exists."
            exit 1
          fi

      - name: Configure AWS credentials for STG
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to STG ECR
        id: ecr-stg
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify RC signature
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Pull validated RC by digest
        run: docker pull "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}"

      - name: Configure AWS credentials for production
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PRO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRO }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to production ECR
        id: ecr-pro
        uses: aws-actions/amazon-ecr-login@v2


      - name: Promote validated digest
        env:
          ECR_REGISTRY_PRO: ${{ steps.ecr-pro.outputs.registry }}
          SOURCE_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          PRO_REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          PRO_IMAGE="${ECR_REGISTRY_PRO}/${PRO_REPOSITORY}"
          for tag in "${ENVIRONMENT}" latest "${GITHUB_SHA}"; do
            docker tag "${SOURCE_IMAGE}" "${PRO_IMAGE}:${tag}"
            docker push "${PRO_IMAGE}:${tag}"
          done

      - name: Force new ECS deployment
        run: |
          set -euo pipefail
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager

      - name: Confirm release candidate is still current
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          CURRENT_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${CURRENT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::A newer release candidate (${CURRENT_SHA}) supersedes ${GITHUB_SHA}."
            exit 1
          fi

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ needs.build.outputs.rc_tag }}

      - name: Download release-readiness evidence
        uses: actions/download-artifact@v4
        with:
          name: release-readiness-${{ needs.build.outputs.version }}

      - name: Publish validated version tag
        env:
          ECR_REGISTRY_PRO: ${{ steps.ecr-pro.outputs.registry }}
          SOURCE_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          PRO_IMAGE="${ECR_REGISTRY_PRO}/${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          docker tag "${SOURCE_IMAGE}" "${PRO_IMAGE}:${VERSION}"
          docker push "${PRO_IMAGE}:${VERSION}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --generate-notes \
            sbom.cdx.json \
            release-readiness.md
