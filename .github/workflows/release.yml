name: release

on:
  push:
    branches:
      - 'release/v*'

env:
  PROJECT_NAME: eudistack
  APP_NAME: wallet-ebw
  REGION_CODE: ew1

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build, verify and publish RC
    if: "${{ !(github.event.created && startsWith(github.event.head_commit.message, 'chore(release): prepare v')) }}"
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.metadata.outputs.image }}
      previous_stg_digest: ${{ steps.previous-stg.outputs.digest }}
      rc_tag: ${{ steps.metadata.outputs.rc_tag }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      ENVIRONMENT: stg
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate release branch and correction count
        id: release-policy
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q properties | awk '/^version:/ {print $2}')"
          EXPECTED_BRANCH="release/v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]]; then
            echo "::error::Branch ${GITHUB_REF_NAME} does not match build.gradle version ${VERSION}."
            exit 1
          fi

          git fetch --no-tags origin main
          MERGE_BASE="$(git merge-base origin/main HEAD)"
          PREPARE_COMMIT="$(git log --format='%H%x09%s' \
            | awk -F '\t' -v message="chore(release): prepare v${VERSION}" \
              '$2 == message {print $1; exit}')"
          if [[ -n "${PREPARE_COMMIT}" ]]; then
            CORRECTIONS="$(git rev-list --count "${PREPARE_COMMIT}..HEAD")"
          else
            CORRECTIONS="$(git rev-list --count "${MERGE_BASE}..HEAD")"
          fi
          if (( CORRECTIONS > 3 )); then
            echo "::error::Release has ${CORRECTIONS} corrections; abort and cut a new release."
            exit 1
          fi

          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists. Cut a new MINOR release."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, unit tests, integration tests and lint
        run: ./gradlew build integrationTest --info

      - name: Scan dependencies, licenses, secrets and IaC
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,license,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          trivyignores: config/trivy/.trivyignore

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Capture current STG rollback point
        id: previous-stg
        run: |
          set -euo pipefail
          REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          DIGEST="$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids imageTag="${ENVIRONMENT}" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "${{ secrets.AWS_REGION }}" 2>/dev/null || true)"
          if [[ "${DIGEST}" == "None" ]]; then
            DIGEST=""
          fi
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Resolve RC metadata
        id: metadata
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q properties | awk '/^version:/ {print $2}')"
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE="${ECR_REGISTRY}/${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          RC_TAG="v${VERSION}-rc-${SHORT_SHA}"
          {
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "rc_tag=${RC_TAG}"
            echo "tags<<EOF"
            echo "${IMAGE}:${RC_TAG}"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push RC image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SKIP_TESTS=true
          tags: ${{ steps.metadata.outputs.tags }}
          provenance: false

      - name: Scan RC container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.metadata.outputs.rc_tag }}
          path: sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image and attach SBOM
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload release application
        uses: actions/upload-artifact@v4
        with:
          name: release-application-${{ github.sha }}
          path: build/libs/*.jar

  migration-rehearsal:
    name: Rehearse migrations on anonymized production copy
    needs: build
    runs-on: ubuntu-latest
    environment: staging-migration
    env:
      JDBC_URL: ${{ secrets.STG_ANON_JDBC_URL }}
      R2DBC_URL: ${{ secrets.STG_ANON_R2DBC_URL }}
      DB_USERNAME: ${{ secrets.STG_ANON_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.STG_ANON_DB_PASSWORD }}
    steps:
      - name: Checkout migration checks
        uses: actions/checkout@v4

      - name: Download release application
        uses: actions/download-artifact@v4
        with:
          name: release-application-${{ github.sha }}
          path: build/libs

      - name: Require anonymized database configuration
        run: |
          if [[ -z "${JDBC_URL}" || -z "${R2DBC_URL}" || -z "${DB_USERNAME}" || -z "${DB_PASSWORD}" ]]; then
            echo "::error::Configure the STG_ANON_* secrets in the staging-migration environment."
            exit 1
          fi

      - name: Apply migrations and verify startup
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -type f | head -n 1)"
          if [[ -z "${JAR}" ]]; then
            echo "::error::Release application JAR was not found."
            exit 1
          fi
          SPRING_FLYWAY_URL="${JDBC_URL}" \
          SPRING_R2DBC_URL="${R2DBC_URL}" \
          SPRING_R2DBC_USERNAME="${DB_USERNAME}" \
          SPRING_R2DBC_PASSWORD="${DB_PASSWORD}" \
          SERVER_PORT=18080 \
          java -jar "${JAR}" > migration-rehearsal.log 2>&1 &
          APP_PID=$!
          trap 'kill "${APP_PID}" 2>/dev/null || true' EXIT
          bash .github/scripts/smoke.sh http://localhost:18080

      - name: Upload migration rehearsal log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-rehearsal-${{ github.sha }}
          path: migration-rehearsal.log

  deploy-stg:
    name: Deploy and validate STG
    needs: [build, migration-rehearsal]
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-wallet-ebw
      cancel-in-progress: false
    env:
      ENVIRONMENT: stg
      BASE_URL: ${{ vars.STG_BASE_URL }}
      BEARER_TOKEN: ${{ secrets.STG_TEST_BEARER_TOKEN }}
      KEY_ID: ${{ secrets.STG_TEST_KEY_ID }}
    steps:
      - name: Checkout deployment checks
        uses: actions/checkout@v4

      - name: Require STG endpoint
        run: |
          if [[ -z "${BASE_URL}" ]]; then
            echo "::error::Configure STG_BASE_URL in the staging GitHub Environment."
            exit 1
          fi

      - name: Reject superseded release candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          CURRENT_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${CURRENT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::A newer release candidate (${CURRENT_SHA}) supersedes ${GITHUB_SHA}."
            exit 1
          fi
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Force new ECS deployment
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          MANIFEST="$(aws ecr batch-get-image \
            --repository-name "${REPOSITORY}" \
            --image-ids imageDigest="${DIGEST}" \
            --query 'images[0].imageManifest' \
            --output text \
            --region "${{ secrets.AWS_REGION }}")"
          for tag in "${ENVIRONMENT}" latest; do
            aws ecr put-image \
              --repository-name "${REPOSITORY}" \
              --image-tag "${tag}" \
              --image-manifest "${MANIFEST}" \
              --region "${{ secrets.AWS_REGION }}" \
              --no-cli-pager > /dev/null
          done
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager

      - name: Run STG smoke test
        run: bash .github/scripts/smoke.sh "${BASE_URL}"

      - name: Require STG test credentials
        run: |
          if [[ -z "${BEARER_TOKEN}" || -z "${KEY_ID}" ]]; then
            echo "::error::Configure STG_TEST_BEARER_TOKEN and STG_TEST_KEY_ID in the staging environment."
            exit 1
          fi

      - name: Run authenticated ZAP full scan
        uses: zaproxy/action-full-scan@v0.12.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ secrets.STG_TEST_BEARER_TOKEN }}
        with:
          target: ${{ vars.STG_BASE_URL }}/business-wallet
          artifact_name: zap-full-stg-${{ github.sha }}
          fail_action: true
          allow_issue_writing: false

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run sustained signing performance gate
        run: k6 run src/test/resources/perf/sign-warm-stg.js

      - name: Run burst signing performance gate
        run: k6 run src/test/resources/perf/sign-burst-stg.js

      - name: Rehearse STG rollback and restore RC
        if: ${{ needs.build.outputs.previous_stg_digest != '' }}
        env:
          PREVIOUS_DIGEST: ${{ needs.build.outputs.previous_stg_digest }}
          RC_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"

          retag_and_deploy() {
            local digest="$1"
            local manifest
            manifest="$(aws ecr batch-get-image \
              --repository-name "${REPOSITORY}" \
              --image-ids imageDigest="${digest}" \
              --query 'images[0].imageManifest' \
              --output text \
              --region "${{ secrets.AWS_REGION }}")"
            aws ecr put-image \
              --repository-name "${REPOSITORY}" \
              --image-tag "${ENVIRONMENT}" \
              --image-manifest "${manifest}" \
              --region "${{ secrets.AWS_REGION }}" \
              --no-cli-pager > /dev/null
            aws ecs update-service \
              --cluster "${CLUSTER}" \
              --service "${SERVICE}" \
              --force-new-deployment \
              --region "${{ secrets.AWS_REGION }}" \
              --no-cli-pager > /dev/null
            aws ecs wait services-stable \
              --cluster "${CLUSTER}" \
              --services "${SERVICE}" \
              --region "${{ secrets.AWS_REGION }}" \
              --no-cli-pager
            bash .github/scripts/smoke.sh "${BASE_URL}"
          }

          retag_and_deploy "${PREVIOUS_DIGEST}"
          retag_and_deploy "${RC_DIGEST}"

  release-readiness:
    name: PM, customer and release-readiness acceptance
    needs: [build, deploy-stg]
    runs-on: ubuntu-latest
    environment: staging-validation
    steps:
      - name: Create release manifest
        run: |
          {
            echo "# Release readiness"
            echo
            echo "- Component: ${APP_NAME}"
            echo "- Version: ${{ needs.build.outputs.version }}"
            echo "- RC tag: ${{ needs.build.outputs.rc_tag }}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Image: ${{ needs.build.outputs.image }}"
            echo "- Digest: ${{ needs.build.outputs.digest }}"
            echo "- STG smoke: passed"
            echo "- Approval environment: staging-validation"
          } > release-readiness.md

      - name: Upload signed release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-v${{ needs.build.outputs.version }}
          path: release-readiness.md

      - name: Attest release-readiness evidence
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-readiness.md

      - name: Publish readiness summary
        run: cat release-readiness.md >> "${GITHUB_STEP_SUMMARY}"

  product-approval:
    name: Product production approval
    needs: release-readiness
    runs-on: ubuntu-latest
    environment: production-product-approval
    steps:
      - name: Record product approval
        run: echo "Product approval recorded."

  technical-approval:
    name: Technical production approval
    needs: release-readiness
    runs-on: ubuntu-latest
    environment: production-technical-approval
    steps:
      - name: Record technical approval
        run: echo "Technical approval recorded."

  deploy-pro:
    name: Promote digest, deploy and monitor PRD
    needs: [build, product-approval, technical-approval]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-wallet-ebw
      cancel-in-progress: false
    outputs:
      previous_digest: ${{ steps.current.outputs.digest }}
    env:
      FROM_ENV: stg
      ENVIRONMENT: pro
      BASE_URL: ${{ vars.PRO_BASE_URL }}
      MONITOR_MINUTES: ${{ vars.PRO_MONITOR_MINUTES }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout deployment checks
        uses: actions/checkout@v4

      - name: Require production endpoint
        run: |
          if [[ -z "${BASE_URL}" ]]; then
            echo "::error::Configure PRO_BASE_URL in the production GitHub Environment."
            exit 1
          fi

      - name: Reject superseded production candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          CURRENT_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${CURRENT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::A newer release candidate (${CURRENT_SHA}) supersedes ${GITHUB_SHA}."
            exit 1
          fi
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists."
            exit 1
          fi

      - name: Configure AWS credentials for STG
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to STG ECR
        id: ecr-stg
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify RC signature
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Pull validated RC by digest
        run: docker pull "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}"

      - name: Configure AWS credentials for production
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PRO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRO }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to production ECR
        id: ecr-pro
        uses: aws-actions/amazon-ecr-login@v2

      - name: Capture current production digest
        id: current
        run: |
          set -euo pipefail
          REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          DIGEST="$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --filter tagStatus=TAGGED \
            --query "imageDetails[?contains(imageTags, '${ENVIRONMENT}')].imageDigest | [0]" \
            --output text \
            --region "${{ secrets.AWS_REGION }}")"
          if [[ "${DIGEST}" == "None" ]]; then
            DIGEST=""
          fi
          VERSION_DIGEST="$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --filter tagStatus=TAGGED \
            --query "imageDetails[?contains(imageTags, 'v${VERSION}')].imageDigest | [0]" \
            --output text \
            --region "${{ secrets.AWS_REGION }}")"
          if [[ "${VERSION_DIGEST}" == "None" ]]; then
            VERSION_DIGEST=""
          fi
          {
            echo "digest=${DIGEST}"
            echo "version_digest=${VERSION_DIGEST}"
          } >> "${GITHUB_OUTPUT}"

      - name: Promote validated digest
        env:
          ECR_REGISTRY_PRO: ${{ steps.ecr-pro.outputs.registry }}
          SOURCE_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          PRO_REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          PRO_IMAGE="${ECR_REGISTRY_PRO}/${PRO_REPOSITORY}"
          for tag in "${ENVIRONMENT}" latest "${GITHUB_SHA}"; do
            docker tag "${SOURCE_IMAGE}" "${PRO_IMAGE}:${tag}"
            docker push "${PRO_IMAGE}:${tag}"
          done

      - name: Force new ECS deployment
        run: |
          set -euo pipefail
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager

      - name: Run production smoke test
        run: bash .github/scripts/smoke.sh "${BASE_URL}"

      - name: Monitor production
        run: |
          set -euo pipefail
          MINUTES="${MONITOR_MINUTES:-30}"
          READINESS_URL="${BASE_URL%/}/business-wallet/health/readiness"
          for minute in $(seq 1 "${MINUTES}"); do
            curl --fail --silent --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              "${READINESS_URL}" > /dev/null
            echo "Production healthy at minute ${minute}/${MINUTES}."
            sleep 60
          done

      - name: Confirm release candidate is still current
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          CURRENT_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${CURRENT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::A newer release candidate (${CURRENT_SHA}) supersedes ${GITHUB_SHA}."
            exit 1
          fi

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ needs.build.outputs.rc_tag }}

      - name: Download release-readiness evidence
        uses: actions/download-artifact@v4
        with:
          name: release-readiness-v${{ needs.build.outputs.version }}

      - name: Publish validated version tag
        env:
          ECR_REGISTRY_PRO: ${{ steps.ecr-pro.outputs.registry }}
          SOURCE_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          PRO_IMAGE="${ECR_REGISTRY_PRO}/${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          docker tag "${SOURCE_IMAGE}" "${PRO_IMAGE}:v${VERSION}"
          docker push "${PRO_IMAGE}:v${VERSION}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes \
            sbom.cdx.json \
            release-readiness.md

      - name: Restore previous production digest
        if: ${{ (failure() || cancelled()) && steps.current.outputs.digest != '' }}
        env:
          ECR_REGISTRY_PRO: ${{ steps.ecr-pro.outputs.registry }}
          PREVIOUS_DIGEST: ${{ steps.current.outputs.digest }}
          PREVIOUS_VERSION_DIGEST: ${{ steps.current.outputs.version_digest }}
        run: |
          set -euo pipefail
          PRO_REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          PRO_IMAGE="${ECR_REGISTRY_PRO}/${PRO_REPOSITORY}"
          docker pull "${PRO_IMAGE}@${PREVIOUS_DIGEST}"
          for tag in "${ENVIRONMENT}" latest; do
            docker tag "${PRO_IMAGE}@${PREVIOUS_DIGEST}" "${PRO_IMAGE}:${tag}"
            docker push "${PRO_IMAGE}:${tag}"
          done
          if [[ -n "${PREVIOUS_VERSION_DIGEST}" ]]; then
            docker pull "${PRO_IMAGE}@${PREVIOUS_VERSION_DIGEST}"
            docker tag "${PRO_IMAGE}@${PREVIOUS_VERSION_DIGEST}" "${PRO_IMAGE}:v${VERSION}"
            docker push "${PRO_IMAGE}:v${VERSION}"
          else
            aws ecr batch-delete-image \
              --repository-name "${PRO_REPOSITORY}" \
              --image-ids imageTag="v${VERSION}" \
              --region "${{ secrets.AWS_REGION }}" \
              --no-cli-pager > /dev/null
          fi
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager
          bash .github/scripts/smoke.sh "${BASE_URL}"

  back-merge:
    name: Back-merge release to main
    needs: [build, deploy-pro]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create back-merge PR or delete synchronized branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MAIN_TREE="$(git rev-parse 'origin/main^{tree}')"
          MERGED_TREE="$(git merge-tree --write-tree origin/main HEAD 2>/dev/null || true)"
          if [[ -n "${MERGED_TREE}" && "${MERGED_TREE}" == "${MAIN_TREE}" ]]; then
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
            exit 0
          fi

          EXISTING_PR="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${GITHUB_REF_NAME}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "${EXISTING_PR}" ]]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --title "chore(release): back-merge v${VERSION}" \
              --body "Back-merge of the production release branch after successful promotion."
          fi
