name: deploy-pro

on:
  workflow_dispatch:

env:
  PROJECT_NAME: eudistack
  APP_NAME: wallet-ebw
  REGION_CODE: ew1

permissions:
  contents: write

jobs:
  cd-pro:
    name: Deploy to Production
    runs-on: ubuntu-latest
    env:
      FROM_ENV: stg
      ENVIRONMENT: pro
    steps:
      - name: Configure AWS credentials (${{ env.FROM_ENV }})
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR (${{ env.FROM_ENV }})
        id: ecr-stg
        uses: aws-actions/amazon-ecr-login@v2

      - name: Read version and SHA from STG ECR tags
        env:
          ECR_REPOSITORY_STG: ${{ env.PROJECT_NAME }}-${{ env.FROM_ENV }}-ecr-${{ env.REGION_CODE }}-${{ env.APP_NAME }}
        run: |
          set -euo pipefail

          DIGEST=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY_STG}" \
            --image-ids imageTag=latest \
            --region "${{ secrets.AWS_REGION }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          TAGS=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY_STG}" \
            --image-ids imageDigest="${DIGEST}" \
            --region "${{ secrets.AWS_REGION }}" \
            --query 'imageDetails[0].imageTags' \
            --output json)

          VERSION=$(echo "${TAGS}" | jq -r '.[] | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' | head -1 | sed 's/^v//')
          SHA=$(echo "${TAGS}" | jq -r '.[] | select(test("^[0-9a-f]{40}$"))' | head -1)

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SHA=${SHA}" >> $GITHUB_ENV

      - name: Confirm deployment target
        run: |
          echo "### 🎯 Production deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** v${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** ${{ env.SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Pull image from ${{ env.FROM_ENV }} ECR
        env:
          ECR_REGISTRY_STG: ${{ steps.ecr-stg.outputs.registry }}
          ECR_REPOSITORY_STG: ${{ env.PROJECT_NAME }}-${{ env.FROM_ENV }}-ecr-${{ env.REGION_CODE }}-${{ env.APP_NAME }}
        run: |
          set -euo pipefail

          STG_IMAGE="${ECR_REGISTRY_STG}/${ECR_REPOSITORY_STG}:latest"
          echo "Pulling staging image: ${STG_IMAGE}"
          docker pull "${STG_IMAGE}"

      - name: Configure AWS credentials (Production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PRO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRO }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR (Production)
        id: ecr-pro
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag & Push to Production ECR
        env:
          ECR_REGISTRY_STG: ${{ steps.ecr-stg.outputs.registry }}
          ECR_REGISTRY_PRO: ${{ steps.ecr-pro.outputs.registry }}
          ECR_REPOSITORY_STG: ${{ env.PROJECT_NAME }}-${{ env.FROM_ENV }}-ecr-${{ env.REGION_CODE }}-${{ env.APP_NAME }}
          ECR_REPOSITORY_PRO: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-ecr-${{ env.REGION_CODE }}-${{ env.APP_NAME }}
        run: |
          set -euo pipefail

          STG_IMAGE="${ECR_REGISTRY_STG}/${ECR_REPOSITORY_STG}:latest"
          PRO_IMAGE="${ECR_REGISTRY_PRO}/${ECR_REPOSITORY_PRO}:${{ env.ENVIRONMENT }}"
          PRO_LATEST="${ECR_REGISTRY_PRO}/${ECR_REPOSITORY_PRO}:latest"
          PRO_VERSION="${ECR_REGISTRY_PRO}/${ECR_REPOSITORY_PRO}:v${{ env.VERSION }}"
          PRO_SHA="${ECR_REGISTRY_PRO}/${ECR_REPOSITORY_PRO}:${{ env.SHA }}"

          echo "Tagging for production..."
          docker tag "${STG_IMAGE}" "${PRO_IMAGE}"
          docker tag "${STG_IMAGE}" "${PRO_LATEST}"
          docker tag "${STG_IMAGE}" "${PRO_VERSION}"
          docker tag "${STG_IMAGE}" "${PRO_SHA}"

          echo "Pushing to production ECR..."
          docker push "${PRO_IMAGE}"
          docker push "${PRO_LATEST}"
          docker push "${PRO_VERSION}"
          docker push "${PRO_SHA}"

          echo "### 📦 Image promoted" >> $GITHUB_STEP_SUMMARY
          echo "- **From:** ${STG_IMAGE}" >> $GITHUB_STEP_SUMMARY
          echo "- **To:** ${PRO_IMAGE}" >> $GITHUB_STEP_SUMMARY

      - name: Force new ECS deployment
        run: |
          set -euo pipefail
          CLUSTER="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-ecs-${{ env.REGION_CODE }}"
          SERVICE="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-ecs-${{ env.REGION_CODE }}-${{ env.APP_NAME }}-service"

          echo "Deploying ${SERVICE} on cluster ${CLUSTER}..."
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager

          echo "### 🚀 Deployment triggered" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** ${CLUSTER}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${SERVICE}" >> $GITHUB_STEP_SUMMARY

      - name: Wait for deployment stability
        run: |
          set -euo pipefail
          CLUSTER="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-ecs-${{ env.REGION_CODE }}"
          SERVICE="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-ecs-${{ env.REGION_CODE }}-${{ env.APP_NAME }}-service"

          echo "Waiting for service stability (timeout: 10 min)..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager || {
              echo "::warning::Service did not stabilize within timeout"
              exit 1
            }

          echo "### ✅ Deployment successful" >> $GITHUB_STEP_SUMMARY

      - name: Download SBOM Artifact from CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.VERSION }}"
          echo "Downloading SBOM artifact for ${TAG} (SHA: ${{ env.SHA }})..."
          gh run download --repo "${{ github.repository }}" --commit "${{ env.SHA }}" --name "sbom-${TAG}" --dir ./sbom-artifact || \
          gh run download --repo "${{ github.repository }}" --name "sbom-${TAG}" --dir ./sbom-artifact

      - name: Validate the published SBOM
        run: node .github/scripts/license-gate.mjs --sbom-path ./sbom-artifact/sbom.json --expect-version ${{ env.VERSION }}

      - name: Prepare SBOM Release Asset
        run: |
          set -euo pipefail
          TAG="v${{ env.VERSION }}"
          cp ./sbom-artifact/sbom.json "./sbom-${TAG}.cdx.json"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.VERSION }}"
          gh release create "${TAG}" \
            "./sbom-${TAG}.cdx.json#CycloneDX SBOM (${TAG})" \
            --repo "${{ github.repository }}" \
            --title "${TAG}" \
            --generate-notes
          echo "### 🏷️ GitHub Release published: ${TAG} with attached SBOM" >> $GITHUB_STEP_SUMMARY
