name: reusable-deploy-pro

on:
  workflow_call:
    inputs:
      version:
        description: Component version to publish, without the leading v
        required: true
        type: string
      digest:
        description: Exact STG image digest from release-readiness evidence (sha256:...)
        required: true
        type: string
      source_sha:
        description: Exact 40-character commit SHA from release-readiness evidence
        required: true
        type: string
      release_run_id:
        description: Release workflow run ID containing the attested release evidence
        required: true
        type: string
      project_name:
        description: Project prefix used in AWS resource names
        required: true
        type: string
      app_name:
        description: Application identifier used in AWS resource names
        required: true
        type: string
      region_code:
        description: Region abbreviation used in AWS resource names
        required: true
        type: string
      staging_environment:
        description: Source deployment environment name
        required: false
        type: string
        default: stg
      production_environment:
        description: GitHub Environment and production deployment name
        required: false
        type: string
        default: pro
      production_smoke_url:
        description: Complete health endpoint URL for the production deployment
        required: true
        type: string
      production_concurrency_group:
        description: Concurrency group used for production deployments
        required: false
        type: string
        default: production
      production_monitor_minutes:
        description: Number of minutes to monitor production readiness
        required: false
        type: string
        default: '30'
      allow_downgrade:
        description: Allow an explicitly justified deployment older than the current production version
        required: false
        type: boolean
        default: false
      downgrade_reason:
        description: Audit reason required when allow_downgrade is true and the version is older
        required: false
        type: string
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID_STG:
        description: AWS access key for the staging account
        required: true
      AWS_SECRET_ACCESS_KEY_STG:
        description: AWS secret access key for the staging account
        required: true
      AWS_ACCESS_KEY_ID_PRO:
        description: AWS access key for the production account
        required: true
      AWS_SECRET_ACCESS_KEY_PRO:
        description: AWS secret access key for the production account
        required: true
      AWS_REGION:
        description: AWS region containing the deployment resources
        required: true

env:
  PROJECT_NAME: ${{ inputs.project_name }}
  APP_NAME: ${{ inputs.app_name }}
  REGION_CODE: ${{ inputs.region_code }}

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  deploy:
    name: Re-promote validated digest to production
    runs-on: ubuntu-latest
    environment: ${{ inputs.production_environment }}
    concurrency:
      group: ${{ inputs.production_concurrency_group }}
      queue: max
      cancel-in-progress: false
    env:
      FROM_ENV: ${{ inputs.staging_environment }}
      ENVIRONMENT: ${{ inputs.production_environment }}
      VERSION: ${{ inputs.version }}
      DIGEST: ${{ inputs.digest }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      SMOKE_URL: ${{ inputs.production_smoke_url }}
      MONITOR_MINUTES: ${{ inputs.production_monitor_minutes }}
      ECS_CONTAINER_NAME: ${{ format('{0}-{1}-ecs-{2}-{3}-task', inputs.project_name, inputs.production_environment, inputs.region_code, inputs.app_name) }}
      ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
      DOWNGRADE_REASON: ${{ inputs.downgrade_reason }}
    steps:
      - name: Checkout deployment checks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate inputs and production endpoint
        run: |
          for variable in PROJECT_NAME APP_NAME REGION_CODE; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Configure the ${variable} repository variable."
              exit 1
            fi
          done
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must use X.Y.Z format."
            exit 1
          fi
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::digest must be a sha256 image digest."
            exit 1
          fi
          if [[ ! "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character commit SHA."
            exit 1
          fi
          if [[ ! "${RELEASE_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::release_run_id must be a numeric workflow run ID."
            exit 1
          fi
          if [[ -z "${SMOKE_URL}" ]]; then
            echo "::error::Configure SMOKE_URL in the ${ENVIRONMENT} GitHub Environment."
            exit 1
          fi
          if [[ ! "${MONITOR_MINUTES}" =~ ^[1-9][0-9]*$ ]] || (( MONITOR_MINUTES > 60 )); then
            echo "::error::PRO_MONITOR_MINUTES must be an integer from 1 to 60."
            exit 1
          fi

      - name: Configure AWS credentials for STG
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to STG ECR
        id: ecr-stg
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Download release-readiness evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence-${{ inputs.version }}
          path: release-evidence
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Verify release evidence
        env:
          ECR_REGISTRY_STG: ${{ steps.ecr-stg.outputs.registry }}
        run: |
          set -euo pipefail
          EXPECTED_IMAGE="${ECR_REGISTRY_STG}/${PROJECT_NAME}-${FROM_ENV}-ecr-${REGION_CODE}-${APP_NAME}"
          jq -e \
            --arg version "${VERSION}" \
            --arg component "${APP_NAME}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${SOURCE_SHA}" \
            --arg image "${EXPECTED_IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg environment "${FROM_ENV}" \
            '
              .schemaVersion == 2
              and .version == $version
              and .component.name == $component
              and .component.repository == $repository
              and .component.commit == $commit
              and .component.image == $image
              and .component.digest == $digest
              and .validation.environment == $environment
              and .validation.smoke == "passed"
              and .validation.expectedDigest == $digest
              and .validation.observedDigest == $digest
              and (.validation.taskDefinitionArn | type == "string" and length > 0)
            ' release-evidence/release-evidence.json > /dev/null

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b
        with:
          version: v0.20.6

      - name: Verify version binding and pull validated STG digest
        env:
          ECR_REGISTRY_STG: ${{ steps.ecr-stg.outputs.registry }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STG_REPOSITORY="${PROJECT_NAME}-${FROM_ENV}-ecr-${REGION_CODE}-${APP_NAME}"
          TAGS="$(aws ecr describe-images \
            --repository-name "${STG_REPOSITORY}" \
            --image-ids imageDigest="${DIGEST}" \
            --query 'imageDetails[0].imageTags' \
            --output text \
            --region "${{ secrets.AWS_REGION }}")"
          EXPECTED_RC_TAG="v${VERSION}-rc-${SOURCE_SHA:0:12}"
          FOUND_RC_TAG=false
          FOUND_SOURCE_SHA=false
          for tag in ${TAGS}; do
            [[ "${tag}" == "${EXPECTED_RC_TAG}" ]] && FOUND_RC_TAG=true
            [[ "${tag}" == "${SOURCE_SHA}" ]] && FOUND_SOURCE_SHA=true
          done
          if [[ "${FOUND_RC_TAG}" != true || "${FOUND_SOURCE_SHA}" != true ]]; then
            echo "::error::Digest ${DIGEST} is not bound to ${EXPECTED_RC_TAG} and ${SOURCE_SHA}."
            exit 1
          fi
          RELEASE_BRANCH_SHA="$(git ls-remote --heads origin "refs/heads/release/v${VERSION}" | awk '{print $1}')"
          if [[ -n "${RELEASE_BRANCH_SHA}" && "${RELEASE_BRANCH_SHA}" != "${SOURCE_SHA}" ]]; then
            echo "::error::release/v${VERSION} now points to ${RELEASE_BRANCH_SHA}, not ${SOURCE_SHA}."
            exit 1
          fi
          STG_IMAGE="${ECR_REGISTRY_STG}/${STG_REPOSITORY}@${DIGEST}"
          cosign verify \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/reusable-release.yml@refs/heads/release/v${VERSION}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${STG_IMAGE}"
          docker pull "${STG_IMAGE}"
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            git fetch --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
            RELEASE_SHA="$(git rev-list -n 1 "v${VERSION}")"
            if [[ "${RELEASE_SHA}" != "${SOURCE_SHA}" ]]; then
              echo "::error::Existing release v${VERSION} targets ${RELEASE_SHA}, not ${SOURCE_SHA}."
              exit 1
            fi
          fi
          echo "STG_IMAGE=${STG_IMAGE}" >> "${GITHUB_ENV}"

      - name: Configure AWS credentials for production
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PRO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRO }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to production ECR
        id: ecr-pro
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Inspect current production deployment
        id: current-production
        run: |
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          bash .github/scripts/ecs-deployment.sh inspect \
            "${CLUSTER}" \
            "${SERVICE}" \
            "${ECS_CONTAINER_NAME}" \
            "${{ secrets.AWS_REGION }}" \
            current-production-task-definition.json

      - name: Enforce production release order
        env:
          CURRENT_VERSION: ${{ steps.current-production.outputs.version }}
          CURRENT_DIGEST: ${{ steps.current-production.outputs.observed_digest }}
        run: |
          node .github/scripts/compare-release-version.mjs \
            "${CURRENT_VERSION}" \
            "${VERSION}" \
            fallback \
            "${ALLOW_DOWNGRADE}" \
            "${DOWNGRADE_REASON}"
          if [[ "${CURRENT_VERSION}" == "${VERSION}" && "${CURRENT_DIGEST}" != "${DIGEST}" ]]; then
            echo "::error::Version ${VERSION} is already deployed with digest ${CURRENT_DIGEST}, not ${DIGEST}."
            exit 1
          fi

      - name: Promote exact digest
        env:
          ECR_REGISTRY_PRO: ${{ steps.ecr-pro.outputs.registry }}
          EXPECTED_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          PRO_REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          PRO_IMAGE="${ECR_REGISTRY_PRO}/${PRO_REPOSITORY}"
          PROMOTED_DIGEST="$(aws ecr batch-get-image \
            --repository-name "${PRO_REPOSITORY}" \
            --image-ids imageTag="${SOURCE_SHA}" \
            --query 'images[0].imageId.imageDigest' \
            --output text \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager)"
          if [[ "${PROMOTED_DIGEST}" != "${EXPECTED_DIGEST}" ]]; then
            crane copy \
              "${STG_IMAGE}" \
              "${PRO_IMAGE}:${SOURCE_SHA}"
            PROMOTED_DIGEST="$(aws ecr describe-images \
              --repository-name "${PRO_REPOSITORY}" \
              --image-ids imageTag="${SOURCE_SHA}" \
              --query 'imageDetails[0].imageDigest' \
              --output text \
              --region "${{ secrets.AWS_REGION }}")"
          fi
          if [[ "${PROMOTED_DIGEST}" != "${EXPECTED_DIGEST}" ]]; then
            echo "::error::Production ECR digest ${PROMOTED_DIGEST} does not match validated STG digest ${EXPECTED_DIGEST}."
            exit 1
          fi
          echo "PRO_IMAGE=${PRO_IMAGE}" >> "${GITHUB_ENV}"

      - name: Validate immutable production version tag
        run: |
          PRO_REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          bash .github/scripts/set-ecr-tags.sh \
            "${PRO_REPOSITORY}" \
            "${DIGEST}" \
            "${{ secrets.AWS_REGION }}" \
            check-immutable \
            "v${VERSION}"

      - name: Register digest-pinned production task definition
        id: register-production
        run: |
          bash .github/scripts/ecs-deployment.sh register \
            current-production-task-definition.json \
            "${ECS_CONTAINER_NAME}" \
            "${PRO_IMAGE}@${DIGEST}" \
            "${VERSION}" \
            "${SOURCE_SHA}" \
            "${DIGEST}" \
            "${ENVIRONMENT}" \
            "${GITHUB_RUN_ID}" \
            "${{ secrets.AWS_REGION }}"

      - name: Deploy digest-pinned production task definition
        env:
          TASK_DEFINITION_ARN: ${{ steps.register-production.outputs.task_definition_arn }}
        run: |
          set -euo pipefail
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager

      - name: Verify production task definition and running digest
        env:
          TASK_DEFINITION_ARN: ${{ steps.register-production.outputs.task_definition_arn }}
        run: |
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          bash .github/scripts/ecs-deployment.sh verify \
            "${CLUSTER}" \
            "${SERVICE}" \
            "${ECS_CONTAINER_NAME}" \
            "${TASK_DEFINITION_ARN}" \
            "${DIGEST}" \
            "${VERSION}" \
            "${SOURCE_SHA}" \
            "${{ secrets.AWS_REGION }}"

      - name: Run production smoke test
        run: bash .github/scripts/smoke.sh "${SMOKE_URL}"

      - name: Monitor production readiness
        run: |
          set -euo pipefail
          for minute in $(seq 1 "${MONITOR_MINUTES}"); do
            sleep 60
            echo "Production readiness check ${minute}/${MONITOR_MINUTES}"
            bash .github/scripts/smoke.sh "${SMOKE_URL}"
          done

      - name: Roll back failed production deployment
        if: ${{ (failure() || cancelled()) && steps.current-production.outputs.task_definition_arn != '' && steps.register-production.outputs.task_definition_arn != '' }}
        env:
          PREVIOUS_TASK_DEFINITION_ARN: ${{ steps.current-production.outputs.task_definition_arn }}
          PREVIOUS_DIGEST: ${{ steps.current-production.outputs.observed_digest }}
        run: |
          set -euo pipefail
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --task-definition "${PREVIOUS_TASK_DEFINITION_ARN}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager
          bash .github/scripts/ecs-deployment.sh verify-runtime \
            "${CLUSTER}" \
            "${SERVICE}" \
            "${ECS_CONTAINER_NAME}" \
            "${PREVIOUS_TASK_DEFINITION_ARN}" \
            "${PREVIOUS_DIGEST}" \
            "${{ secrets.AWS_REGION }}"
          bash .github/scripts/smoke.sh "${SMOKE_URL}"

      - name: Publish validated production tags
        run: |
          PRO_REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          bash .github/scripts/set-ecr-tags.sh \
            "${PRO_REPOSITORY}" \
            "${DIGEST}" \
            "${{ secrets.AWS_REGION }}" \
            immutable \
            "v${VERSION}"
          bash .github/scripts/set-ecr-tags.sh \
            "${PRO_REPOSITORY}" \
            "${DIGEST}" \
            "${{ secrets.AWS_REGION }}" \
            mutable \
            "${ENVIRONMENT}" \
            latest

      - name: Publish GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${SOURCE_SHA}" \
              --title "${TAG}" \
              --generate-notes \
              release-evidence/release-readiness.md \
              release-evidence/release-evidence.json
          fi
