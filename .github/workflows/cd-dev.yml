name: cd-dev

# TBD flow: every merge to main is automatically deployed to DEV.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

env:
  PROJECT_NAME: eudistack
  APP_NAME: wallet-ebw
  REGION_CODE: ew1

permissions:
  contents: read

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build, Test & SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar --info

      - name: SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: build/sonar/report-task.txt

  build:
    name: Build > Tag > Push
    needs: sonar
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: dev
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Get Project Metadata
        id: metadata
        run: |
          VERSION=$(./gradlew -q properties | grep '^version:' | awk '{print $2}')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-ecr-${{ env.REGION_CODE }}-${{ env.APP_NAME }}
        run: |
          set -euo pipefail

          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ env.ENVIRONMENT }}"
          ECR_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          ECR_VERSION="${ECR_REGISTRY}/${ECR_REPOSITORY}:v${{ env.VERSION }}"
          ECR_SHA="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"

          docker build --build-arg SKIP_TESTS=true -t "${ECR_IMAGE}" .
          docker tag "${ECR_IMAGE}" "${ECR_LATEST}"
          docker tag "${ECR_IMAGE}" "${ECR_VERSION}"
          docker tag "${ECR_IMAGE}" "${ECR_SHA}"

          docker push "${ECR_IMAGE}"
          docker push "${ECR_LATEST}"
          docker push "${ECR_VERSION}"
          docker push "${ECR_SHA}"

  cd-dev:
    name: Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: dev
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Force new ECS deployment
        run: |
          set -euo pipefail
          CLUSTER="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-ecs-${{ env.REGION_CODE }}"
          SERVICE="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-ecs-${{ env.REGION_CODE }}-${{ env.APP_NAME }}-service"

          echo "Deploying ${SERVICE} on cluster ${CLUSTER}..."
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager

          echo "### 🚀 Deployment triggered" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** ${CLUSTER}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${SERVICE}" >> $GITHUB_STEP_SUMMARY

      - name: Wait for deployment stability
        run: |
          set -euo pipefail
          CLUSTER="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-ecs-${{ env.REGION_CODE }}"
          SERVICE="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-ecs-${{ env.REGION_CODE }}-${{ env.APP_NAME }}-service"

          echo "Waiting for service stability (timeout: 10 min)..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager || {
              echo "::warning::Service did not stabilize within timeout"
              exit 1
            }

          echo "### ✅ Deployment successful" >> $GITHUB_STEP_SUMMARY
