name: reusable-release

on:
  workflow_call:
    inputs:
      project_name:
        description: Project prefix used in AWS resource names
        required: true
        type: string
      app_name:
        description: Application identifier used in AWS resource names
        required: true
        type: string
      region_code:
        description: Region abbreviation used in AWS resource names
        required: true
        type: string
      staging_environment:
        description: GitHub Environment and deployment name for staging
        required: false
        type: string
        default: stg
      production_environment:
        description: GitHub Environment and deployment name for production
        required: false
        type: string
        default: pro
      staging_smoke_url:
        description: Complete health endpoint URL for the staging deployment
        required: true
        type: string
      production_smoke_url:
        description: Complete health endpoint URL for the production deployment
        required: true
        type: string
      staging_concurrency_group:
        description: Concurrency group used for staging deployments
        required: false
        type: string
        default: staging
      production_concurrency_group:
        description: Concurrency group used for production deployments
        required: false
        type: string
        default: production
      production_monitor_minutes:
        description: Number of minutes to monitor production readiness
        required: false
        type: string
        default: '30'
      java_version:
        description: Java version used to build the application
        required: false
        type: string
        default: '25'
    secrets:
      github_token:
        description: GitHub token supplied by the calling workflow
        required: true
      SONAR_TOKEN:
        description: SonarCloud authentication token
        required: true
      AWS_ACCESS_KEY_ID_STG:
        description: AWS access key for the staging account
        required: true
      AWS_SECRET_ACCESS_KEY_STG:
        description: AWS secret access key for the staging account
        required: true
      AWS_ACCESS_KEY_ID_PRO:
        description: AWS access key for the production account
        required: true
      AWS_SECRET_ACCESS_KEY_PRO:
        description: AWS secret access key for the production account
        required: true
      AWS_REGION:
        description: AWS region containing the deployment resources
        required: true

env:
  PROJECT_NAME: ${{ inputs.project_name }}
  APP_NAME: ${{ inputs.app_name }}
  REGION_CODE: ${{ inputs.region_code }}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build, verify and publish RC
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.metadata.outputs.image }}
      previous_stg_digest: ${{ steps.previous-stg.outputs.digest }}
      rc_tag: ${{ steps.metadata.outputs.rc_tag }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      ENVIRONMENT: ${{ inputs.staging_environment }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate release branch and correction count
        id: release-policy
        run: |
          set -euo pipefail
          for variable in PROJECT_NAME APP_NAME REGION_CODE; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Configure the ${variable} repository variable."
              exit 1
            fi
          done
          if [[ ! "${GITHUB_REF_NAME}" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch ${GITHUB_REF_NAME} must use release/vX.Y.Z format."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#release/v}"

          git fetch --no-tags origin main
          MERGE_BASE="$(git merge-base origin/main HEAD)"
          PREPARE_COMMIT="$(git log --format='%H%x09%s' \
            | awk -F '\t' -v message="chore(release): prepare v${VERSION}" \
              '$2 == message {print $1; exit}')"
          if [[ -n "${PREPARE_COMMIT}" ]]; then
            CORRECTIONS="$(git rev-list --count "${PREPARE_COMMIT}..HEAD")"
          else
            CORRECTIONS="$(git rev-list --count "${MERGE_BASE}..HEAD")"
          fi
          if (( CORRECTIONS > 3 )); then
            echo "::error::Release has ${CORRECTIONS} corrections; abort and cut a new release."
            exit 1
          fi

          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists. Cut a new MINOR release."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.github_token }}

      - name: Build, unit tests, integration tests and SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build integrationTest cyclonedxBom sonar --info

      - name: SonarCloud quality gate
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: build/sonar/report-task.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Verify license gate
        run: node --test .github/scripts/license-gate.test.mjs

      - name: Evaluate release licenses
        run: node .github/scripts/license-gate.mjs --sbom-path build/reports/sbom/sbom.json

      - name: Scan source, dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          trivyignores: config/trivy/.trivyignore

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Capture current STG rollback point
        id: previous-stg
        run: |
          set -euo pipefail
          REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          DIGEST="$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids imageTag="${ENVIRONMENT}" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "${{ secrets.AWS_REGION }}" 2>/dev/null || true)"
          if [[ "${DIGEST}" == "None" ]]; then
            DIGEST=""
          fi
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Resolve RC metadata
        id: metadata
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#release/v}"
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE="${ECR_REGISTRY}/${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          RC_TAG="v${VERSION}-rc-${SHORT_SHA}"
          {
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "rc_tag=${RC_TAG}"
            echo "tags<<EOF"
            echo "${IMAGE}:${RC_TAG}"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push RC image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: SKIP_TESTS=true
          tags: ${{ steps.metadata.outputs.tags }}
          provenance: false

      - name: Scan RC container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          trivyignores: config/trivy/.trivyignore

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ steps.metadata.outputs.rc_tag }}
          path: sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image and attach SBOM
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-stg:
    name: Deploy and validate STG
    needs: [build]
    runs-on: ubuntu-latest
    environment: ${{ inputs.staging_environment }}
    concurrency:
      group: ${{ inputs.staging_concurrency_group }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.staging_environment }}
      SMOKE_URL: ${{ inputs.staging_smoke_url }}
    steps:
      - name: Checkout deployment checks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require STG smoke endpoint
        run: |
          if [[ -z "${SMOKE_URL}" ]]; then
            echo "::error::Configure SMOKE_URL in the ${ENVIRONMENT} GitHub Environment."
            exit 1
          fi

      - name: Reject superseded release candidate
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          CURRENT_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${CURRENT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::A newer release candidate (${CURRENT_SHA}) supersedes ${GITHUB_SHA}."
            exit 1
          fi
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Force new ECS deployment
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          MANIFEST="$(aws ecr batch-get-image \
            --repository-name "${REPOSITORY}" \
            --image-ids imageDigest="${DIGEST}" \
            --query 'images[0].imageManifest' \
            --output text \
            --region "${{ secrets.AWS_REGION }}")"
          for tag in "${ENVIRONMENT}" latest; do
            aws ecr put-image \
              --repository-name "${REPOSITORY}" \
              --image-tag "${tag}" \
              --image-manifest "${MANIFEST}" \
              --region "${{ secrets.AWS_REGION }}" \
              --no-cli-pager > /dev/null
          done
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager

      - name: Run STG smoke test
        run: bash .github/scripts/smoke.sh "${SMOKE_URL}"

      - name: Rehearse STG rollback and restore RC
        if: ${{ needs.build.outputs.previous_stg_digest != '' }}
        env:
          PREVIOUS_DIGEST: ${{ needs.build.outputs.previous_stg_digest }}
          RC_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"

          retag_and_deploy() {
            local digest="$1"
            local manifest
            manifest="$(aws ecr batch-get-image \
              --repository-name "${REPOSITORY}" \
              --image-ids imageDigest="${digest}" \
              --query 'images[0].imageManifest' \
              --output text \
              --region "${{ secrets.AWS_REGION }}")"
            for tag in "${ENVIRONMENT}" latest; do
              aws ecr put-image \
                --repository-name "${REPOSITORY}" \
                --image-tag "${tag}" \
                --image-manifest "${manifest}" \
                --region "${{ secrets.AWS_REGION }}" \
                --no-cli-pager > /dev/null
            done
            aws ecs update-service \
              --cluster "${CLUSTER}" \
              --service "${SERVICE}" \
              --force-new-deployment \
              --region "${{ secrets.AWS_REGION }}" \
              --no-cli-pager > /dev/null
            aws ecs wait services-stable \
              --cluster "${CLUSTER}" \
              --services "${SERVICE}" \
              --region "${{ secrets.AWS_REGION }}" \
              --no-cli-pager
            bash .github/scripts/smoke.sh "${SMOKE_URL}"
          }

          retag_and_deploy "${PREVIOUS_DIGEST}"
          retag_and_deploy "${RC_DIGEST}"

  release-readiness:
    name: PM, customer and release-readiness acceptance
    needs: [build, deploy-stg]
    runs-on: ubuntu-latest
    environment: ${{ inputs.staging_environment }}
    env:
      ENVIRONMENT: ${{ inputs.staging_environment }}
      ROLLBACK_REHEARSAL: ${{ needs.build.outputs.previous_stg_digest != '' && 'passed' || 'skipped' }}
    steps:
      - name: Create release evidence
        run: |
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg version "${{ needs.build.outputs.version }}" \
            --arg component "${APP_NAME}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg image "${{ needs.build.outputs.image }}" \
            --arg digest "${{ needs.build.outputs.digest }}" \
            --arg generatedAt "${GENERATED_AT}" \
            --arg environment "${ENVIRONMENT}" \
            --arg rollbackRehearsal "${ROLLBACK_REHEARSAL}" \
            '{
              schemaVersion: 1,
              version: $version,
              generatedAt: $generatedAt,
              component: {
                name: $component,
                repository: $repository,
                commit: $commit,
                image: $image,
                digest: $digest
              },
              validation: {
                environment: $environment,
                smoke: "passed",
                rollbackRehearsal: $rollbackRehearsal
              }
            }' > release-evidence.json
          {
            echo "# Release readiness"
            echo
            echo "- Component: ${APP_NAME}"
            echo "- Version: ${{ needs.build.outputs.version }}"
            echo "- RC tag: ${{ needs.build.outputs.rc_tag }}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Image: ${{ needs.build.outputs.image }}"
            echo "- Digest: ${{ needs.build.outputs.digest }}"
            echo "- STG smoke: passed"
            echo "- STG rollback rehearsal: ${ROLLBACK_REHEARSAL}"
            echo "- Approval environment: ${ENVIRONMENT}"
            echo "- Machine-readable evidence: release-evidence.json"
          } > release-readiness.md

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ needs.build.outputs.version }}
          path: |
            release-readiness.md
            release-evidence.json

      - name: Attest release evidence
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release-readiness.md
            release-evidence.json

      - name: Publish readiness summary
        run: cat release-readiness.md >> "${GITHUB_STEP_SUMMARY}"

  deploy-pro:
    name: Promote digest, deploy and monitor PRD
    needs: [build, release-readiness]
    runs-on: ubuntu-latest
    environment: ${{ inputs.production_environment }}
    concurrency:
      group: ${{ inputs.production_concurrency_group }}
      cancel-in-progress: false
    env:
      FROM_ENV: ${{ inputs.staging_environment }}
      ENVIRONMENT: ${{ inputs.production_environment }}
      SMOKE_URL: ${{ inputs.production_smoke_url }}
      MONITOR_MINUTES: ${{ inputs.production_monitor_minutes }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout deployment checks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download release-readiness evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence-${{ needs.build.outputs.version }}

      - name: Verify release evidence
        env:
          EXPECTED_IMAGE: ${{ needs.build.outputs.image }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          jq -e \
            --arg version "${VERSION}" \
            --arg component "${APP_NAME}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg image "${EXPECTED_IMAGE}" \
            --arg digest "${EXPECTED_DIGEST}" \
            --arg environment "${FROM_ENV}" \
            '
              .schemaVersion == 1
              and .version == $version
              and .component.name == $component
              and .component.repository == $repository
              and .component.commit == $commit
              and .component.image == $image
              and .component.digest == $digest
              and .validation.environment == $environment
              and .validation.smoke == "passed"
              and (
                .validation.rollbackRehearsal == "passed"
                or .validation.rollbackRehearsal == "skipped"
              )
            ' release-evidence.json > /dev/null

      - name: Reject superseded production candidate
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          CURRENT_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${CURRENT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::A newer release candidate (${CURRENT_SHA}) supersedes ${GITHUB_SHA}."
            exit 1
          fi
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists."
            exit 1
          fi
          if [[ -z "${SMOKE_URL}" ]]; then
            echo "::error::Configure SMOKE_URL in the ${ENVIRONMENT} GitHub Environment."
            exit 1
          fi
          if [[ ! "${MONITOR_MINUTES}" =~ ^[1-9][0-9]*$ ]] || (( MONITOR_MINUTES > 60 )); then
            echo "::error::PRO_MONITOR_MINUTES must be an integer from 1 to 60."
            exit 1
          fi

      - name: Configure AWS credentials for STG
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STG }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STG }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to STG ECR
        id: ecr-stg
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify RC signature
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/reusable-release.yml@refs/heads/release/v${VERSION}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Pull validated RC by digest
        run: docker pull "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}"

      - name: Configure AWS credentials for production
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PRO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRO }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to production ECR
        id: ecr-pro
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Capture current production rollback point
        id: current
        run: |
          set -euo pipefail
          PRO_REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          PREVIOUS_DIGEST="$(aws ecr describe-images \
            --repository-name "${PRO_REPOSITORY}" \
            --image-ids imageTag="${ENVIRONMENT}" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "${{ secrets.AWS_REGION }}" 2>/dev/null || true)"
          if [[ -z "${PREVIOUS_DIGEST}" || "${PREVIOUS_DIGEST}" == "None" ]]; then
            echo "::error::No current production digest exists; automatic rollback cannot be guaranteed."
            exit 1
          fi
          echo "digest=${PREVIOUS_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Promote validated digest
        env:
          ECR_REGISTRY_PRO: ${{ steps.ecr-pro.outputs.registry }}
          SOURCE_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          PRO_REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          PRO_IMAGE="${ECR_REGISTRY_PRO}/${PRO_REPOSITORY}"
          for tag in "${ENVIRONMENT}" latest "${GITHUB_SHA}"; do
            docker tag "${SOURCE_IMAGE}" "${PRO_IMAGE}:${tag}"
            docker push "${PRO_IMAGE}:${tag}"
          done

      - name: Force new ECS deployment
        run: |
          set -euo pipefail
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager

      - name: Run production smoke test
        run: bash .github/scripts/smoke.sh "${SMOKE_URL}"

      - name: Monitor production readiness
        run: |
          set -euo pipefail
          for minute in $(seq 1 "${MONITOR_MINUTES}"); do
            sleep 60
            echo "Production readiness check ${minute}/${MONITOR_MINUTES}"
            bash .github/scripts/smoke.sh "${SMOKE_URL}"
          done

      - name: Confirm release candidate is still current
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          CURRENT_SHA="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "${CURRENT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::A newer release candidate (${CURRENT_SHA}) supersedes ${GITHUB_SHA}."
            exit 1
          fi

      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-${{ needs.build.outputs.rc_tag }}

      - name: Roll back failed production deployment
        if: ${{ (failure() || cancelled()) && steps.current.outputs.digest != '' }}
        env:
          PREVIOUS_DIGEST: ${{ steps.current.outputs.digest }}
        run: |
          set -euo pipefail
          PRO_REPOSITORY="${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          MANIFEST="$(aws ecr batch-get-image \
            --repository-name "${PRO_REPOSITORY}" \
            --image-ids imageDigest="${PREVIOUS_DIGEST}" \
            --query 'images[0].imageManifest' \
            --output text \
            --region "${{ secrets.AWS_REGION }}")"
          for tag in "${ENVIRONMENT}" latest; do
            aws ecr put-image \
              --repository-name "${PRO_REPOSITORY}" \
              --image-tag "${tag}" \
              --image-manifest "${MANIFEST}" \
              --region "${{ secrets.AWS_REGION }}" \
              --no-cli-pager > /dev/null
          done
          CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}"
          SERVICE="${PROJECT_NAME}-${ENVIRONMENT}-ecs-${REGION_CODE}-${APP_NAME}-service"
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${{ secrets.AWS_REGION }}" \
            --no-cli-pager
          bash .github/scripts/smoke.sh "${SMOKE_URL}"

      - name: Publish validated version tag
        env:
          ECR_REGISTRY_PRO: ${{ steps.ecr-pro.outputs.registry }}
          SOURCE_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          PRO_IMAGE="${ECR_REGISTRY_PRO}/${PROJECT_NAME}-${ENVIRONMENT}-ecr-${REGION_CODE}-${APP_NAME}"
          docker tag "${SOURCE_IMAGE}" "${PRO_IMAGE}:v${VERSION}"
          docker push "${PRO_IMAGE}:v${VERSION}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes \
            sbom.cdx.json \
            release-readiness.md \
            release-evidence.json
