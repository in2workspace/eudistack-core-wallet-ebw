# ZAP Baseline Configuration — DEV environments
#
# Passive scan only. No active attacks. Safe for any environment.
# Reference: https://www.zaproxy.org/docs/docker/baseline-scan/
#
# Usage:
#   docker run --rm zaproxy/zap-stable zap-baseline.py \
#     -t https://your-verifier-url \
#     -c /zap/wrk/zap-baseline.conf
#
# Rules: WARN = report but don't fail | IGNORE = skip | FAIL = fail the scan
#
# --- Headers & Security Config ---
10010	WARN	(Cookie No HttpOnly Flag)
10011	WARN	(Cookie Without Secure Flag)
