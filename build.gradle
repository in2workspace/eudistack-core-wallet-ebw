plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'checkstyle'
    id 'org.sonarqube' version '7.2.2.6593'
    id 'com.github.ben-manes.versions' version '0.61.0'
    id 'se.patrikerdes.use-latest-versions' version '0.2.19'
    id 'org.cyclonedx.bom' version '3.4.1'
}

group = 'com.eudistack'
version = '1.13.2'
ext['netty.version'] = '4.1.132.Final'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacoco {
    toolVersion = "0.8.14"
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://jitpack.io') }
}

dependencies {
    // --- Spring Boot Starters ---
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // --- Database ---
    implementation 'org.postgresql:r2dbc-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework:spring-jdbc'

    // --- Cache ---
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // --- Serialization ---
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.22.2'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'

    // --- AWS SDK v2 ---
    implementation 'software.amazon.awssdk:cloudwatchlogs:2.31.78'

    // --- Cryptography ---
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'

    // --- Monitoring & Telemetry ---
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'io.micrometer:micrometer-registry-otlp'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    // --- DevTools ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- Testing ---
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:localstack'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:r2dbc'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// --- Quality & CI ---

cyclonedxBom {
    includeConfigs = ['runtimeClasspath']
    schemaVersion = '1.6'
    destination = project.file('build/reports/sbom')
    outputName = 'sbom'
    outputFormat = 'json'
    includeBomSerialNumber = false
    includeLicenseText = false
}

sonar {
    properties {
        property 'sonar.projectKey', 'in2workspace_eudistack-core-wallet-ebw'
        property 'sonar.organization', 'in2workspace'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.sources', 'src/main/java,src/main/resources'
        property 'sonar.exclusions', 'src/main/resources/**/*.sql'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
    }
}

checkstyle {
    toolVersion = '10.16.0'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

checkstyleMain {
    source = 'src/main/java'
}

checkstyleTest {
    source = 'src/test/java'
}

// --- Tasks ---

tasks.named('compileJava') {
    inputs.files(tasks.named('processResources'))
}

// Unit tests (default 'test' task)
tasks.named('test') {
    useJUnitPlatform()
    finalizedBy(tasks.jacocoTestReport)
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.jacocoTestReport {
    dependsOn(tasks.test)
    reports {
        xml.required.set(true)
        csv.required.set(false)
        html.outputLocation.set(layout.buildDirectory.dir('jacocoHtml'))
    }
}

// Integration tests (separate task)
tasks.register('integrationTest', Test) {
    description = 'Runs tests tagged with @Tag("integration") (requires Docker/Testcontainers).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

// Run both
tasks.register('allTests') {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
}

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        isNonStable(it.candidate.version)
    }
}
