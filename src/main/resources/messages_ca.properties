# Correus del wallet en català (EUD-8 annex/wireframes.md §Emails, EUD-15 annex/wireframes.md §Emails).
# {0} de l'assumpte és el nom del wallet del tenant. Dates en dd/MM/yyyy i hores en HH:mm, a ebw.timezone.
email.greeting=Hola:

# Codi d'accés
email.tx-code.subject=El teu codi per entrar a {0}
email.tx-code.body=El teu codi és:
email.tx-code.hint=Caduca d''aquí a {0} minuts.
email.tx-code.footer=Si no l''has demanat tu, ignora aquest correu: ningú no pot entrar sense el codi.

# Botó comú dels avisos al titular
email.devices.button=Revisar els meus dispositius
email.devices.footer=L''enllaç obre el teu wallet i et demana que hi entris: des d''aquest correu no es canvia res.

# Passkey nova
email.new-passkey.subject=S''ha afegit una passkey al teu wallet
email.new-passkey.body=El {0} a les {1} es va afegir una passkey nova al teu wallet.
email.new-passkey.hint=Si has estat tu, no cal que facis res. Si no, entra al teu wallet i revisa els teus dispositius.

# Alta completa (primer dispositiu d'un compte nou)
email.account-complete.subject=El teu wallet de {0} ja és a punt
email.account-complete.body=Has creat el teu wallet el {0} a les {1} al dispositiu «{2}».
email.account-complete.hint=Pots veure els teus dispositius a Configuració, Dispositius.
email.account-complete.footer=Reps aquest correu perquè has creat el teu wallet amb aquesta adreça.

# Dispositiu nou
email.new-device.subject=Nou dispositiu al teu wallet
email.new-device.body=El {0} a les {1} es va registrar el dispositiu «{2}» al teu wallet.
email.new-device.passkey=Per entrar es va afegir una passkey nova al teu compte.
email.new-device.hint=Si has estat tu, no cal que facis res. Si no, revoca''l.

# Compte nou (alta amb tiquet)
email.account-created.subject=S''ha creat el teu wallet de {0}
email.account-created.body=El {0} a les {1} es va crear el teu wallet, al dispositiu «{2}».
email.account-created.hint=Si has estat tu, no cal que facis res.
email.account-created.question=No has estat tu?
email.account-created.button=No he estat jo
email.account-created.expiry=L''enllaç caduca el {0}.
email.account-created.footer=L''enllaç només es pot fer servir una vegada i demana confirmació abans de fer res.
# Compte que ja existia sense passkeys (EUD-315 P17, textos provisionals del PO)
email.account-created.added.subject=S''ha afegit una passkey al teu wallet de {0}
email.account-created.added.body=El {0} a les {1} es va afegir una passkey al teu wallet, al dispositiu «{2}».

# Alerta al contacte de seguretat del tenant
email.onboarding-alert.subject=Alta de wallet no reconeguda
email.onboarding-alert.body=El titular de {0} ha indicat que no va crear el seu wallet.
email.onboarding-alert.registered=Alta: {0}
email.onboarding-alert.actions=S''han tancat les seves sessions, s''ha retirat la passkey i s''han revocat els dispositius d''aquella alta. Revisa com va identificar la persona el sistema que va demanar l''alta.
email.onboarding-alert.footer=Reps aquest correu com a contacte de seguretat del wallet.
email.onboarding-alert.added.subject=Passkey de wallet no reconeguda
email.onboarding-alert.added.body=El titular de {0} ha indicat que no va afegir la passkey nova al seu wallet.
email.onboarding-alert.added.registered=Afegida: {0}
