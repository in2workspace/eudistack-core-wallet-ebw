email.tx-code.subject=Your {0} verification code — Wallet
email.tx-code.greeting=Hello,
email.tx-code.body=Your verification code
email.tx-code.hint=Enter this code in the Wallet. It expires in {0} minutes.
email.tx-code.footer=If you did not request this code, you can safely ignore this email.
email.new-passkey.subject=New passkey added to your Wallet account
email.new-passkey.header=New passkey added
email.new-passkey.greeting=Hello,
email.new-passkey.body=A new passkey has been added to your Wallet account. You can now sign in with it.
email.new-passkey.hint=If it was you, you do not need to do anything. You can end the sessions of your other devices from the Wallet.
email.new-passkey.footer=If it was not you, someone with access to your email may have added it: sign in to the Wallet and remove the passkey you do not recognize.
email.onboarding-alert.subject=Wallet onboarding not recognized — {0}
email.onboarding-alert.greeting=Hello,
email.onboarding-alert.header=Wallet onboarding not recognized
email.onboarding-alert.body=The holder of {0} has said they did not create their wallet.
email.onboarding-alert.registered=Created: {0}
email.onboarding-alert.actions=Their sessions have been ended and the passkey of that onboarding removed. Review how the system that requested it identified the person.
email.onboarding-alert.footer=You receive this email as the security contact of the wallet.
email.account-created.subject=Your {0} wallet has been created
email.account-created.greeting=Hello,
email.account-created.header=Your wallet has been created
email.account-created.body=On {0} your wallet was created.
email.account-created.hint=If it was you, you do not need to do anything.
email.account-created.question=Was it not you?
email.account-created.button=It was not me
email.account-created.expiry=The link expires on {0}.
email.account-created.footer=The link can be used only once. It ends the sessions of the wallet and removes the passkey that was created.
