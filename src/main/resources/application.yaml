spring:
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ebw}
    username: ${DB_USERNAME:ebw}
    password: ${DB_PASSWORD:ebw}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ebw}
    user: ${DB_USERNAME:ebw}
    password: ${DB_PASSWORD:ebw}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          from: ${SMTP_FROM:noreply@eudistack.com}

ebw:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: eudistack-ebw
  otp:
    length: 6
    expiration: 10m
    max-attempts: 5
  rate-limit:
    register-per-email: 3
    register-per-ip: 10
    verify-per-email: 10
    verify-per-ip: 20
    refresh-per-ip: 60
    logout-per-ip: 20
    window: 1h
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  security:
    max-payload-size: 65536

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.eudistack.ebw: ${LOG_LEVEL:INFO}
