spring:
  application:
    name: eudistack-core-wallet-ebw
  webflux:
    base-path: /business-wallet
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eudistack}}
    username: ${SPRING_R2DBC_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_R2DBC_PASSWORD:${DB_PASSWORD:postgres}}
    properties:
      statementTimeout: PT1S
  flyway:
    # Disabled: TenantSchemaFlywayMigrator runs migrations for `public` + all
    # tenant schemas using R2DBC credentials. Spring Boot's auto-configured
    # flywayInitializer would need its own JDBC user/password (only
    # SPRING_FLYWAY_URL is injected in ECS) and would fail on SCRAM auth.
    enabled: false
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eudistack}}
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:public}
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          from: ${SMTP_FROM:noreply@eudistack.com}
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}
            trust: ${SMTP_SSL_TRUST:}

server:
  port: 8080

ebw:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    access-token-ttl: 15m
    refresh-token-ttl: 90d
    issuer: ${EBW_JWT_ISSUER:eudistack-ebw}
  otp:
    length: 6
    expiration: 10m
    max-attempts: 5
  rate-limit:
    register-per-email: 3
    register-per-ip: 10
    verify-per-email: 10
    verify-per-ip: 20
    refresh-per-ip: 60
    logout-per-ip: 20
    window: 1h
  encryption:
    key-path: ${ENCRYPTION_KEY_PATH:}
    # TEMP (hasta EUDISTACK-413): fallback para dev/STG mientras no hay key manager.
    # En producción ENCRYPTION_KEY debe venir de SSM. Eliminar el default cuando EUDISTACK-413 esté listo.
    key: ${ENCRYPTION_KEY:+/6bYXrSY4W65fTv7OALJfBNcxNe1U5s+v/GbZiBt6Y=}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  security:
    max-payload-size: 65536
    trust-forwarded-host: ${TRUST_FORWARDED_HOST:false}

management:
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    metrics:
      export:
        enabled: false
  endpoints:                          # ← Note: 'endpoints' (plural) for web exposure settings
    web:
      exposure:
        include: health, info, prometheus    # ← Also missing comma between 'info' and 'prometheus'
      base-path: /
      path-mapping:
        health: health
        prometheus: prometheus
  endpoint:                           # ← 'endpoint' (singular) for individual endpoint config
    health:
      access: unrestricted
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
      show-components: ${MANAGEMENT_HEALTH_SHOW_COMPONENTS:when-authorized}
      probes:
        enabled: true
      # SMTP is an informational dependency: its failure must not take the
      # wallet-ebw out of the ALB pool. Aggregate /health still reports all
      # indicators (incl. smtp) but readiness/liveness — used by ALB and k8s
      # probes — only include the state indicators. Mirrors issuer-core.
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
    prometheus:
      access: unrestricted
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Default Spring MailHealthIndicator hangs on implicit-TLS endpoints
    # (port 465 / mail.smtp.ssl.enable=true) because it probes with plain
    # "smtp" transport. Disabled in favour of the custom SmtpHealthIndicator
    # that selects "smtps" when SSL is enabled. Mirrors issuer-core 3.4.4.
    mail:
      enabled: false

keymanager:
  audit:
    enabled: ${KEYMANAGER_AUDIT_ENABLED:false}
    log-group-name: ${KEYMANAGER_AUDIT_LOG_GROUP:/eudistack/audit/wallet-ebw/local}
  sign:
    # Opaque rejection delay in milliseconds (ADR-025, AD-407-2).
    # Default approximates p50 of warm signing path. MUST be calibrated empirically in STG
    # before production (NFR-S-407-03). See OpaqueRejectionConstantTimeIT.
    opaque-rejection-delay-millis: ${KEYMANAGER_SIGN_OPAQUE_REJECTION_DELAY_MS:80}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
    com.eudistack.ebw: ${LOG_LEVEL:INFO}
