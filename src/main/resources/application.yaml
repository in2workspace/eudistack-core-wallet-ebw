spring:
  application:
    # Also the OTLP service.name; each environment can rename it (DEV: wallet-ebw).
    name: ${OTEL_SERVICE_NAME:eudistack-core-wallet-ebw}
  config:
    import:
      # Email branding per tenant (image flags, social links). Each environment can replace the whole file:
      # EMAIL_BRANDING_PATH=file:/path/email-branding.yaml (the bundled one is then not loaded).
      - ${EMAIL_BRANDING_PATH:classpath:email-branding.yaml}
  webflux:
    base-path: /business-wallet
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eudistack}}
    username: ${SPRING_R2DBC_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_R2DBC_PASSWORD:${DB_PASSWORD:postgres}}
    properties:
      statementTimeout: PT1S
  flyway:
    # Disabled: TenantSchemaFlywayMigrator runs migrations for `public` + all
    # tenant schemas using R2DBC credentials. Spring Boot's auto-configured
    # flywayInitializer would need its own JDBC user/password (only
    # SPRING_FLYWAY_URL is injected in ECS) and would fail on SCRAM auth.
    enabled: false
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eudistack}}
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:public}
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          from: ${SMTP_FROM:noreply@eudistack.com}
          # Bounded SMTP calls: a slow server must not hold a request thread (EUD-308).
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_TIMEOUT_MS:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}
            trust: ${SMTP_SSL_TRUST:}

server:
  port: 8080

ebw:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    # Session access token (EUD-308). The refresh token lifetime is per tenant:
    # tenant_config ebw.session.idle_timeout / ebw.session.max_duration.
    access-token-ttl: 5m
    issuer: ${EBW_JWT_ISSUER:eudistack-ebw}
  otp:
    length: 6
    expiration: 10m
    max-attempts: 5
  rate-limit:
    register-per-email: 3
    register-per-ip: 10
    verify-per-email: 10
    verify-per-ip: 20
    refresh-per-ip: 60
    # Passkey registration (options + registration) and sign-in (options + session)
    # per origin IP and window; each attempt is two requests (FR-06).
    passkey-registration-per-ip: 20
    session-per-ip: 60
    passkey-prf-sign-per-ip: 30
    window: 1h
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
    origins-path: ${APP_CORS_ORIGINS_PATH:}
  security:
    max-payload-size: 65536
    trust-forwarded-host: ${TRUST_FORWARDED_HOST:false}

management:
  # OTLP/gRPC export to the OTel Collector → OpenObserve. Exports default off:
  # local runs and tests must not try to export.
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_COLLECTOR_GRPC_URL:http://127.0.0.1:4317}
        step: 5s
        resource-attributes:
          service.name: ${spring.application.name}
    tracing:
      transport: grpc
      endpoint: ${OTEL_COLLECTOR_GRPC_URL:http://127.0.0.1:4317}
      export:
        enabled: ${MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED:false}
    logging:
      # INFO and above only (threshold of the OTLP appender in logback-spring.xml)
      endpoint: ${OTEL_COLLECTOR_GRPC_URL:http://127.0.0.1:4317}
      transport: ${MANAGEMENT_OTLP_LOGGING_TRANSPORT:grpc}
      export:
        enabled: ${MANAGEMENT_OTLP_LOGGING_EXPORT_ENABLED:false}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  endpoints:                         # ← Note: 'endpoints' (plural) for web exposure settings
    web:
      exposure:
        include: health, info, prometheus    # ← Also missing comma between 'info' and 'prometheus'
      base-path: /
      path-mapping:
        health: health
        prometheus: prometheus
  endpoint:                           # ← 'endpoint' (singular) for individual endpoint config
    health:
      access: unrestricted
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
      show-components: ${MANAGEMENT_HEALTH_SHOW_COMPONENTS:when-authorized}
      probes:
        enabled: true
      # SMTP is an informational dependency: its failure must not take the
      # wallet-ebw out of the ALB pool. Aggregate /health still reports all
      # indicators (incl. smtp) but readiness/liveness — used by ALB and k8s
      # probes — only include the state indicators. Mirrors issuer-core.
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
    prometheus:
      access: unrestricted
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Default Spring MailHealthIndicator hangs on implicit-TLS endpoints
    # (port 465 / mail.smtp.ssl.enable=true) because it probes with plain
    # "smtp" transport. Disabled in favour of the custom SmtpHealthIndicator
    # that selects "smtps" when SSL is enabled. Mirrors issuer-core 3.4.4.
    mail:
      enabled: false

keymanager:
  audit:
    enabled: ${KEYMANAGER_AUDIT_ENABLED:false}
    log-group-name: ${KEYMANAGER_AUDIT_LOG_GROUP:/eudistack/audit/wallet-ebw/local}
  sign:
    # Opaque rejection delay in milliseconds (ADR-025, AD-407-2).
    # Default approximates p50 of warm signing path. MUST be calibrated empirically in STG
    # before production (NFR-S-407-03). See OpaqueRejectionConstantTimeIT.
    opaque-rejection-delay-millis: ${KEYMANAGER_SIGN_OPAQUE_REJECTION_DELAY_MS:80}

email-branding:
  # Tenant-assets root of this environment. No default: platform-iac sets it per environment
  # and local-env/compose.yaml (platform-dev) for local; startup fails if it is missing.
  assets-base-url: ${EMAIL_ASSETS_BASE_URL:}

logging:
  # The console pattern (service name, traceId, spanId) and the PII masking live in logback-spring.xml
  level:
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
    com.eudistack.ebw: ${LOG_LEVEL:INFO}
