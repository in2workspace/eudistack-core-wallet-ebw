# Emails del wallet en castellano (EUD-8 annex/wireframes.md §Emails, EUD-15 annex/wireframes.md §Emails).
# {0} del asunto es el nombre del wallet del tenant. Fechas en dd/MM/yyyy y horas en HH:mm, en ebw.timezone.
email.greeting=Hola:

# Código de acceso
email.tx-code.subject=Tu código para entrar en {0}
email.tx-code.body=Tu código es:
email.tx-code.hint=Caduca en {0} minutos.
email.tx-code.footer=Si no lo has pedido tú, ignora este email: nadie puede entrar sin el código.

# Botón común de los avisos al titular
email.devices.button=Revisar mis dispositivos
email.devices.footer=El enlace abre tu wallet y te pide entrar: desde este email no se cambia nada.

# Passkey nueva
email.new-passkey.subject=Se ha añadido una passkey a tu wallet
email.new-passkey.body=El {0} a las {1} se añadió una passkey nueva a tu wallet.
email.new-passkey.hint=Si has sido tú, no tienes que hacer nada. Si no, entra en tu wallet y revisa tus dispositivos.

# Alta completa (primer dispositivo de una cuenta nueva)
email.account-complete.subject=Tu wallet de {0} está listo
email.account-complete.body=Has creado tu wallet el {0} a las {1} en el dispositivo «{2}».
email.account-complete.hint=Puedes ver tus dispositivos en Ajustes, Dispositivos.
email.account-complete.footer=Recibes este email porque has creado tu wallet con esta dirección.

# Dispositivo nuevo
email.new-device.subject=Nuevo dispositivo en tu wallet
email.new-device.body=El {0} a las {1} se registró el dispositivo «{2}» en tu wallet.
email.new-device.passkey=Para entrar se añadió una passkey nueva a tu cuenta.
email.new-device.hint=Si has sido tú, no tienes que hacer nada. Si no, revócalo.

# Cuenta nueva (alta con ticket)
email.account-created.subject=Se ha creado tu wallet de {0}
email.account-created.body=El {0} a las {1} se creó tu wallet, en el dispositivo «{2}».
email.account-created.hint=Si has sido tú, no tienes que hacer nada.
email.account-created.question=¿No has sido tú?
email.account-created.button=No he sido yo
email.account-created.expiry=El enlace caduca el {0}.
email.account-created.footer=El enlace solo se puede usar una vez y pide confirmar antes de hacer nada.
# Cuenta que ya existía sin passkeys (EUD-315 P17, textos provisionales del PO)
email.account-created.added.subject=Se ha añadido una passkey a tu wallet de {0}
email.account-created.added.body=El {0} a las {1} se añadió una passkey a tu wallet, en el dispositivo «{2}».

# Alerta al contacto de seguridad del tenant
email.onboarding-alert.subject=Alta de wallet no reconocida
email.onboarding-alert.body=El titular de {0} ha indicado que no creó su wallet.
email.onboarding-alert.registered=Alta: {0}
email.onboarding-alert.actions=Se han cerrado sus sesiones, retirado la passkey y revocado los dispositivos de esa alta. Revisa cómo identificó a la persona el sistema que pidió el alta.
email.onboarding-alert.footer=Recibes este email como contacto de seguridad del wallet.
email.onboarding-alert.added.subject=Passkey de wallet no reconocida
email.onboarding-alert.added.body=El titular de {0} ha indicado que no añadió la passkey nueva a su wallet.
email.onboarding-alert.added.registered=Añadida: {0}
