<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head th:replace="~{fragments/email-layout :: head(title=#{email.tx-code.subject(${tenantDisplayName})})}">
    <title>Your verification code</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; font-family: 'Blinker', Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff;">
    <tr>
        <td align="center" style="padding: 24px 10px;">
            <table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" style="width: 100%; max-width: 640px; background-color: #ffffff; border-radius: 8px; overflow: hidden;">
                <tr th:replace="~{fragments/email-layout :: header(${branding}, #{email.tx-code.greeting}, 'font-size: 18px; line-height: 1.5; margin-bottom: 8px;')}"></tr>

                <!-- CONTENT -->
                <tr>
                    <td align="center" style="padding: 12px 40px 32px 40px; font-family: 'Blinker', Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #000000; text-align: center;">
                        <p style="margin: 0 0 24px 0; font-size: 14px; font-weight: 400;" th:text="#{email.tx-code.body}">Your verification code</p>

                        <!-- VERIFICATION CODE -->
                        <table role="presentation" width="500" align="center" cellspacing="0" cellpadding="0" border="0"
                               style="width: 100%; max-width: 500px; margin: 0 auto;">
                            <tr>
                                <td align="center" style="padding: 16px; background-color: #EBF0F7; border: 1px solid #8EACE1; border-radius: 16px; font-family: 'Blinker', Arial, Helvetica, sans-serif; color: #000000;">
                                    <span style="font-family: 'Blinker', Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 6px; color: #000000;" th:text="${txCode}">123456</span>
                                </td>
                            </tr>
                        </table>

                        <p style="margin: 24px 0 0 0; font-size: 14px; font-weight: 400; color: #000000;" th:text="#{email.tx-code.hint(${expirationMinutes})}">Enter this code in the Wallet. It expires in 10 minutes.</p>
                    </td>
                </tr>

                <tr th:replace="~{fragments/email-layout :: footer(${branding}, ~{::footerText})}">
                    <td>
                        <span th:fragment="footerText" style="font-size: 12px; font-weight: 400;" th:text="#{email.tx-code.footer}">If you did not request this code, you can safely ignore this email.</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
