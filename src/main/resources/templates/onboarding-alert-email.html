<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="es">
<head th:replace="~{fragments/email-layout :: head(title=${accountCreated} ? #{email.onboarding-alert.subject} : #{email.onboarding-alert.added.subject})}">
    <title>Alta de wallet no reconocida</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; font-family: 'Blinker', Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff;">
    <tr>
        <td align="center" style="padding: 24px 10px;">
            <table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" style="width: 100%; max-width: 640px; background-color: #ffffff; border-radius: 8px; overflow: hidden;">
                <tr th:replace="~{fragments/email-layout :: header(${branding}, #{email.greeting}, 'font-size: 18px; line-height: 1.5; margin-bottom: 16px;')}"></tr>

                <!-- CONTENT (EUD-8 wireframes, alert to the tenant's security contact; FR-32). Always in the tenant's
                     default language (FR-38). Without the system that requested the ticket (EUD-315 P12, design 1.4.0). -->
                <tr>
                    <td align="center" style="padding: 12px 40px 32px 40px; font-family: 'Blinker', Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #000000; text-align: center;">
                        <p style="margin: 0 0 16px 0; font-size: 14px; font-weight: 400;" th:text="${accountCreated} ? #{email.onboarding-alert.body(${maskedEmail})} : #{email.onboarding-alert.added.body(${maskedEmail})}">El titular de a***@dominio.es ha indicado que no creó su wallet.</p>
                        <p style="margin: 0 0 24px 0; font-size: 14px; font-weight: 400;" th:text="${accountCreated} ? #{email.onboarding-alert.registered(${registeredAt})} : #{email.onboarding-alert.added.registered(${registeredAt})}">Alta: 30/10/2026 10:42</p>
                        <p style="margin: 0; font-size: 14px; font-weight: 400; color: #000000;" th:text="#{email.onboarding-alert.actions}">Se han cerrado sus sesiones, retirado la passkey y revocado los dispositivos de esa alta.</p>
                    </td>
                </tr>

                <tr th:replace="~{fragments/email-layout :: footer(${branding}, ~{::footerText})}">
                    <td>
                        <span th:fragment="footerText" style="font-size: 12px; font-weight: 400;" th:text="#{email.onboarding-alert.footer}">Recibes este email como contacto de seguridad del wallet.</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
