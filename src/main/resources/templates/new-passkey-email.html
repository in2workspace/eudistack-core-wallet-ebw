<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="es">
<head th:replace="~{fragments/email-layout :: head(title=#{email.new-passkey.subject})}">
    <title>Se ha añadido una passkey a tu wallet</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; font-family: 'Blinker', Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff;">
    <tr>
        <td align="center" style="padding: 24px 10px;">
            <table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" style="width: 100%; max-width: 640px; background-color: #ffffff; border-radius: 8px; overflow: hidden;">
                <tr th:replace="~{fragments/email-layout :: header(${branding}, #{email.greeting}, 'font-size: 18px; line-height: 1.5; margin-bottom: 8px;')}"></tr>

                <!-- CONTENT (EUD-8 wireframes, "Passkey nueva"; FR-10): only when the session did not register a device. -->
                <tr>
                    <td align="center" style="padding: 12px 40px 32px 40px; font-family: 'Blinker', Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #000000; text-align: center;">
                        <p style="margin: 0 0 16px 0; font-size: 14px; font-weight: 400;" th:text="#{email.new-passkey.body(${date}, ${time})}">El 30/10/2026 a las 10:42 se añadió una passkey nueva a tu wallet.</p>
                        <p style="margin: 0; font-size: 14px; font-weight: 400;" th:text="#{email.new-passkey.hint}">Si has sido tú, no tienes que hacer nada. Si no, entra en tu wallet y revisa tus dispositivos.</p>
                        <th:block th:if="${devicesUrl != null}"><table th:replace="~{fragments/devices-button :: button(${devicesUrl})}"></table></th:block>
                    </td>
                </tr>

                <tr th:replace="~{fragments/email-layout :: footer(${branding}, ~{::footerText})}">
                    <td>
                        <span th:fragment="footerText" th:if="${devicesUrl != null}" style="font-size: 12px; font-weight: 400;" th:text="#{email.devices.footer}">El enlace abre tu wallet y te pide entrar: desde este email no se cambia nada.</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
