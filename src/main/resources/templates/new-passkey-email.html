<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="#{email.new-passkey.header}">New passkey added</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
<table role="presentation" style="width: 100%; border-collapse: collapse; border-spacing: 0; border: 0; background-color: #f4f5f7;">
    <tr>
        <td style="text-align: center; padding: 24px 0;">
            <table role="presentation" style="width: 100%; max-width: 640px; margin: 0 auto; border-collapse: collapse; border-spacing: 0; border: 0; background-color: #ffffff; border-radius: 8px; overflow: hidden;">
                <!-- HEADER -->
                <tr>
                    <td style="text-align: center; background-color: #0F2B5B; padding: 20px; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 24px; font-weight: bold;" th:text="#{email.new-passkey.header}">
                        New passkey added
                    </td>
                </tr>
                <!-- CONTENT -->
                <tr>
                    <td style="text-align: center; padding: 40px 30px 30px 30px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 16px; color: #333333;">
                        <p style="margin: 0 0 16px 0;" th:text="#{email.new-passkey.greeting}">Hello,</p>
                        <p style="margin: 0 0 24px 0;" th:text="#{email.new-passkey.body}">A new passkey has been added to your Wallet account.</p>

                        <p style="margin: 24px 0 0 0; font-size: 14px; color: #666666;" th:text="#{email.new-passkey.hint}">Please enter this verification code in your Wallet App.</p>
                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td style="text-align: center; padding: 20px 30px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; color: #999999; border-top: 1px solid #e0e0e0;">
                        <p style="margin: 0;" th:text="#{email.new-passkey.footer}">If you did not request this code, please ignore this email.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
