# Wallet emails in English (EUD-8 annex/wireframes.md §Emails, EUD-15 annex/wireframes.md §Emails).
# {0} of the subject is the name of the tenant's wallet. Dates as dd/MM/yyyy and times as HH:mm, in ebw.timezone.
email.greeting=Hello,

# Sign-in code
email.tx-code.subject=Your code to sign in to {0}
email.tx-code.body=Your code is:
email.tx-code.hint=It expires in {0} minutes.
email.tx-code.footer=If you did not ask for it, ignore this email: nobody can sign in without the code.

# Common button of the notices to the holder
email.devices.button=Review my devices
email.devices.footer=The link opens your wallet and asks you to sign in: nothing is changed from this email.

# New passkey
email.new-passkey.subject=A passkey has been added to your wallet
email.new-passkey.body=On {0} at {1} a new passkey was added to your wallet.
email.new-passkey.hint=If it was you, you do not need to do anything. If not, sign in to your wallet and review your devices.

# Complete sign-up (first device of a new account)
email.account-complete.subject=Your {0} wallet is ready
email.account-complete.body=You created your wallet on {0} at {1} on the device "{2}".
email.account-complete.hint=You can see your devices in Settings, Devices.
email.account-complete.footer=You receive this email because you created your wallet with this address.

# New device
email.new-device.subject=New device in your wallet
email.new-device.body=On {0} at {1} the device "{2}" was registered in your wallet.
email.new-device.passkey=A new passkey was added to your account to sign in.
email.new-device.hint=If it was you, you do not need to do anything. If not, revoke it.

# New account (onboarding ticket)
email.account-created.subject=Your {0} wallet has been created
email.account-created.body=On {0} at {1} your wallet was created, on the device "{2}".
email.account-created.hint=If it was you, you do not need to do anything.
email.account-created.question=Was it not you?
email.account-created.button=It was not me
email.account-created.expiry=The link expires on {0}.
email.account-created.footer=The link can be used only once and asks you to confirm before doing anything.
# Account that already existed without passkeys (EUD-315 P17, provisional texts of the PO)
email.account-created.added.subject=A passkey has been added to your {0} wallet
email.account-created.added.body=On {0} at {1} a passkey was added to your wallet, on the device "{2}".

# Alert to the tenant's security contact
email.onboarding-alert.subject=Wallet sign-up not recognized
email.onboarding-alert.body=The holder of {0} has said they did not create their wallet.
email.onboarding-alert.registered=Sign-up: {0}
email.onboarding-alert.actions=Their sessions have been ended, the passkey removed and the devices of that sign-up revoked. Review how the system that requested the sign-up identified the person.
email.onboarding-alert.footer=You receive this email as the security contact of the wallet.
email.onboarding-alert.added.subject=Wallet passkey not recognized
email.onboarding-alert.added.body=The holder of {0} has said they did not add the new passkey to their wallet.
email.onboarding-alert.added.registered=Added: {0}
